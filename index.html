    ctx.fillStyle = "#a8763c";
    ctx.fillRect(-3, 3, 6, 2);                                   // グリップ
  } else if (mid === 2){     // ナイフ
    ctx.rotate(-0.4);
    ctx.fillStyle = "#5a4326"; ctx.fillRect(-2, 2, 4, 9);        // 柄
    ctx.fillStyle = "#8a5a2b"; ctx.fillRect(-5.5, 0, 11, 3);     // 鍔
    ctx.fillStyle = "#dfe6f2";
    ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(0, -17); ctx.lineTo(3, 0); ctx.closePath(); ctx.fill();  // 刃
    ctx.fillStyle = "#b8c2d4";
    ctx.beginPath(); ctx.moveTo(0, -17); ctx.lineTo(3, 0); ctx.lineTo(1, 0); ctx.closePath(); ctx.fill();
  } else if (mid === 3){     // チェンソー
    ctx.fillStyle = "#e07820";
    roundRect(-9, -3, 13, 9, 2);                                 // エンジン部
    ctx.fillStyle = "#8a8f9c";
    roundRect(1, -6, 17, 7, 3.5);                                // ガイドバー
    ctx.strokeStyle = "#3c414c"; ctx.lineWidth = 1.8;            // チェーン
    ctx.beginPath(); ctx.moveTo(2, -6.5); ctx.lineTo(17, -6.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2, 1.5); ctx.lineTo(17, 1.5); ctx.stroke();
    ctx.fillStyle = "#3c414c";
    roundRect(-8, -8, 5, 5, 2);                                  // ハンドル
  }
  ctx.restore();
}
// 特攻隊員(赤いベレーで前線に突撃する)。近接武器を構える
function drawRaider(rd, mid){
  beginPersp(rd.x, rd.y);
  {                                                // 近づくほど大きく(遠近感)
    const dk = depthK(rd.y);
    ctx.translate(rd.x, rd.y);
    ctx.scale(dk, dk);
    ctx.translate(-rd.x, -rd.y);
  }
  ctx.save();
  ctx.translate(rd.x, rd.y + Math.sin(rd.wob) * 1.5);
  ctx.scale(1.5, 1.5);
  ctx.fillStyle = "#2c3320";                               // 軍パンツ
  ctx.fillRect(-3.2, 2, 2.6, 5.4);
  ctx.fillRect(0.6, 2, 2.6, 5.4);
  ctx.fillStyle = "#5c4a3a";                               // 特攻スタイルの上衣
  roundRect(-4, -4, 8, 7, 2);
  ctx.fillStyle = "#3d3126";
  ctx.fillRect(-2.4, -3.4, 4.8, 6);
  ctx.fillStyle = "#d8b48c";                               // 顔
  ctx.beginPath(); ctx.arc(0, -8, 3.6, 0, 6.283); ctx.fill();
  ctx.fillStyle = "#1a2014";
  ctx.fillRect(-2.3, -8.4, 1.6, 1.2);
  ctx.fillRect(0.7, -8.4, 1.6, 1.2);
  ctx.fillStyle = "#a83232";                               // 赤いベレー帽
  ctx.beginPath(); ctx.arc(0, -9.2, 3.9, Math.PI, 0); ctx.fill();
  ctx.fillRect(-4, -9.6, 8, 1.5);
  // 一人ひとりの体力ゲージ
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(-4.6, -15.2, 9.2, 2.4);
  ctx.fillStyle = "#5df08d";
  ctx.fillRect(-4.1, -14.7, 8.2, 1.4);
  // 近接武器(無ければ素手)
  if (mid > 0){
    ctx.save();
    ctx.translate(4.5, -4);
    ctx.scale(0.5, 0.5);
    drawMeleeIcon(mid, 0, 0);
    ctx.restore();
  } else {
    ctx.fillStyle = "#d8b48c";
    ctx.beginPath(); ctx.arc(4.4, -4.4, 1.9, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(-4.4, -3.0, 1.9, 0, 6.283); ctx.fill();
  }
  ctx.restore();
  ctx.restore();                                   // 遠近変換おわり
}
// 戦車(人の約2倍サイズ)に一般兵が乗っている
function drawTankRide(x, y){
  for (let k = -1; k <= 1; k++){                 // 乗っている兵士
    const hx = x + k * 10;
    ctx.fillStyle = "#d8b48c";
    ctx.beginPath(); ctx.arc(hx, y - 20, 3.4, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#38452c";
    ctx.beginPath(); ctx.arc(hx, y - 21, 3.4, Math.PI, 0); ctx.fill();
  }
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(2.2, 2.2);
  drawVehicleIcon("tank", 0, 0);
  ctx.restore();
}
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.fill();
}
function overlayBG(){
  ctx.fillStyle = "rgba(8,12,28,0.78)";
  ctx.fillRect(0,0,W,H);
}
function drawTitle(){
  overlayBG();
  ctx.textAlign = "center";
  ctx.fillStyle = "#8fc1ff";
  ctx.font = "bold 40px -apple-system, sans-serif";
  ctx.fillText("LANE BATTLE", W/2, 250);
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.font = "15px -apple-system, sans-serif";
  ctx.fillText("部隊を移動して、", W/2, 322);
  ctx.fillText("仲間や武器を集めてボスを倒そう！", W/2, 348);
  ctx.fillStyle = "#5df08d";
  ctx.font = "bold 20px -apple-system, sans-serif";
  ctx.fillText("タップでスタート", W/2, 510 + Math.sin(performance.now()/300)*4);
}
function drawWin(){
  overlayBG();
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffd76b";
  ctx.font = "bold 34px -apple-system, sans-serif";
  ctx.fillText("MISSION COMPLETE!", W/2, 250);
  ctx.fillStyle = "#5df08d";
  ctx.font = "bold 24px -apple-system, sans-serif";
  ctx.fillText("全10ステージ制覇！", W/2, 300);
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.font = "15px -apple-system, sans-serif";
  ctx.fillText("撃破: " + killCount, W/2, 340);
  if (overT > 0.6){
    ctx.fillStyle = "#5df08d";
    ctx.font = "bold 20px -apple-system, sans-serif";
    ctx.fillText("タップで最初から", W/2, 460 + Math.sin(performance.now()/300)*4);
  }
}
function drawOver(){
  overlayBG();
  ctx.textAlign = "center";
  ctx.fillStyle = "#ff6b6b";
  ctx.font = "bold 36px -apple-system, sans-serif";
  ctx.fillText("部隊は全滅した…", W/2, 260);
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.font = "bold 26px -apple-system, sans-serif";
  ctx.fillText("STAGE " + stage + " まで到達!", W/2, 320);
  ctx.font = "16px -apple-system, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillText("ベスト: STAGE " + best + " / 撃破: " + killCount, W/2, 355);
  if (overT > 0.6){
    ctx.fillStyle = "#5df08d";
    ctx.font = "bold 20px -apple-system, sans-serif";
    ctx.fillText("タップでリトライ", W/2, 460 + Math.sin(performance.now()/300)*4);
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.font = "13px -apple-system, sans-serif";
    ctx.fillText("STAGE " + stage + " から再開", W/2, 492);
  }
}

// ================= メインループ =================
let last = performance.now();
function loop(now){
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  draw(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
