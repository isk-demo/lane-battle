<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LANE BATTLE プロトタイプ</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b1020;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:none;
    overscroll-behavior:none;-webkit-touch-callout:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;background:#0b1020;touch-action:none;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
"use strict";
// ================= 基本設定 =================
const W = 400, H = 700;              // 論理サイズ
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let scale = 1;

function fit(){
  const ww = window.innerWidth, wh = window.innerHeight;
  scale = Math.min(ww / W, wh / H);
  cv.style.width  = (W * scale) + "px";
  cv.style.height = (H * scale) + "px";
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = W * dpr;
  cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", fit);
fit();

// ================= 状態 =================
const ROAD_L = 30, ROAD_R = W - 30;         // 道路の左右端
const LANES = 3;                             // ゲートの枠数

// ===== 奥行き(遠近法)。ロジックは平面座標のまま、描画だけ変換する =====
// 手前(画面下)が広く、奥(画面上)が狭い
function pf(y){ return 0.55 + 0.45 * Math.max(0, Math.min(1, y / H)); }  // 奥行き縮尺
function px(x, y){ return W/2 + (x - W/2) * pf(y); }                     // X座標の射影
// (cx, cy)を基準に絶対座標の描画コードをそのまま遠近変換するラッパー
function beginPersp(cx, cy){
  const s = pf(cy);
  ctx.save();
  ctx.translate(px(cx, cy), cy);
  ctx.scale(s, s);
  ctx.translate(-cx, -cy);
  return s;
}
function laneW(){ return (ROAD_R - ROAD_L) / LANES; }
function laneAt(x){ return Math.max(0, Math.min(LANES - 1, Math.floor((x - ROAD_L) / laneW()))); }

// 武器: ゲートで入手。拳銃以外は弾数制限があり、撃ち切るとストックの次へ(なければ拳銃)
const WEAPONS = [
  { name:"拳銃",         rate:0.72,  dmg:1,  bspd:560, color:"#ffe680", bw:4, bh:10, ammo: Infinity },
  { name:"ライフル",     rate:0.10,  dmg:2,  bspd:700, color:"#7fe7ff", bw:4, bh:15, ammo: 70 },
  { name:"マシンガン",   rate:0.055, dmg:1,  bspd:640, color:"#ffd27a", bw:3, bh:9,  ammo: 140, jitter:true },
  { name:"ショットガン", rate:0.20,  dmg:1,  bspd:520, color:"#ffb37a", bw:5, bh:7,  ammo: 45,  spread:true },
  { name:"大砲",         rate:0.30,  dmg:6,  bspd:480, color:"#ff9c5c", ammo: 30,  cannon:true },
  { name:"レーザー",     rate:0.09,  dmg:1,  bspd:900, color:"#8affe9", bw:2, bh:24, ammo: 60,  pierce:3 },
  { name:"ロケットランチャー", short:"ロケラン", rate:0.45, dmg:10, bspd:380, color:"#ff7a7a", ammo: 15, missile:true },
  { name:"戦車",         rate:0.35,  dmg:7,  bspd:460, color:"#9fd48a", ammo: 25,  cannon:true, tank:true },
  { name:"手榴弾",       rate:0.85,  dmg:5,  bspd:300, color:"#a8d86b", ammo: 20,  grenade:true },
  { name:"火炎放射",     short:"火炎", rate:0.06, dmg:1, bspd:340, color:"#ff9c3c", stream:true, range:200 },
  { name:"毒ガス",       short:"毒ガス", rate:0.09, dmg:1, bspd:290, color:"#8fe85c", stream:true, range:235 }
];
// 特攻部隊の近距離武器(0=素手が最弱)
const MELEE = [
  { name:"素手",       dmg:1, rate:0.9 },
  { name:"棍棒",       dmg:2, rate:0.85 },
  { name:"ナイフ",     dmg:3, rate:0.55 },
  { name:"チェンソー", dmg:7, rate:0.45 }
];
// 難易度調整パラメータ(weapon_config.html で変更できる)
const DIFF = {
  officerW: 1,        // 幹部の出現の重み(特攻:幹部 = assaultW:officerW)
  assaultW: 3,        // 特攻部隊の出現の重み
  peopleShare: 0.5,   // レーンのうち「人の檻」が出る割合(残りは武器)
  meleeShare: 0.25,   // 武器のうち近接武器が出る割合
  valMulMax: 10,      // 宝箱の数字 = 武器所持数 × 1〜この倍率
  gainMax: 5,         // 檻から出てくる人数 = 1〜この値
  wpnMax: 5,          // 武器宝箱でもらえる本数 = 1〜この値
  enemyBase: 3,       // 雑魚の人数 = enemyBase + 進行距離÷enemyDiv + 0〜3
  enemyDiv: 22,
  midBase: 0.30,      // 装甲兵の出現率 = midBase + (ステージ-1)×midPerStage (上限midCap)
  midPerStage: 0.04,
  midCap: 0.65,
  chargeBase: 55,     // 敵の突進速度 = chargeBase + (ステージ-1)×chargePerStage
  chargePerStage: 8,
  bossHpBase: 120,    // ボスHP = bossHpBase + (ステージ-1)×bossHpPerStage + 進行距離×0.15
  bossHpPerStage: 90,
  bossDist: 440,      // ボスが出るまでの距離(m)
  speedBase: 48,      // スクロール速度 = speedBase + 進行距離×speedFactor (上限speedCap)
  speedFactor: 0.16,
  speedCap: 96
};
// 武器の強さ・難易度設定を読み込む(weapon_config.html で編集して保存すると、同じサイトのゲームに反映される)
try {
  const cfg = JSON.parse(localStorage.getItem("lb_weapon_cfg") || "null");
  if (cfg){
    if (Array.isArray(cfg.ranged)) cfg.ranged.forEach((c, i) => {
      if (WEAPONS[i] && c){
        if (c.dmg > 0) WEAPONS[i].dmg = +c.dmg;
        if (c.rate > 0) WEAPONS[i].rate = +c.rate;
      }
    });
    if (Array.isArray(cfg.melee)) cfg.melee.forEach((c, i) => {
      if (MELEE[i] && c){
        if (c.dmg > 0) MELEE[i].dmg = +c.dmg;
        if (c.rate > 0) MELEE[i].rate = +c.rate;
      }
    });
    if (cfg.diff){
      for (const k in DIFF){
        const v = +cfg.diff[k];
        if (isFinite(v) && v >= 0) DIFF[k] = v;
      }
    }
  }
} catch (e) { /* localStorageが使えない環境ではデフォルト値で動く */ }

// ステージごとに世界観がガラッと変わる背景テーマ
const THEMES = [
  { bgTop:"#0e1530", bgBot:"#0b1020", road:"#171f3d", edge:"#2a3560", dash:"rgba(120,140,210,0.35)" }, // 夜の都市
  { bgTop:"#4a2c0e", bgBot:"#2a1808", road:"#573a17", edge:"#7d5722", dash:"rgba(255,214,140,0.4)"  }, // 砂漠
  { bgTop:"#0d2f1e", bgBot:"#07180f", road:"#154030", edge:"#216448", dash:"rgba(140,255,190,0.35)" }, // ジャングル
  { bgTop:"#310f38", bgBot:"#1a0722", road:"#42184f", edge:"#682a7e", dash:"rgba(230,150,255,0.35)" }, // 魔界
  { bgTop:"#11303c", bgBot:"#081820", road:"#164252", edge:"#22637a", dash:"rgba(150,230,255,0.35)" }  // 氷雪
];
// おどろおどろしいスタイル用の暗いテーマ
const THEMES_DARK = [
  { bgTop:"#1a1022", bgBot:"#0a0510", road:"#241830", edge:"#3a2a4a", dash:"rgba(160,120,200,0.3)"  }, // 呪われた夜道
  { bgTop:"#251208", bgBot:"#120903", road:"#301a0c", edge:"#4a2c14", dash:"rgba(220,160,110,0.3)"  }, // 荒廃した荒野
  { bgTop:"#0a1a12", bgBot:"#050d08", road:"#102418", edge:"#1a3a26", dash:"rgba(120,200,150,0.28)" }, // 毒の森
  { bgTop:"#1e0a0a", bgBot:"#0d0404", road:"#2a1010", edge:"#421a1a", dash:"rgba(255,120,120,0.28)" }, // 血の道
  { bgTop:"#101318", bgBot:"#06080c", road:"#181d26", edge:"#262e3c", dash:"rgba(150,170,200,0.25)" }  // 亡霊の霧
];
let gameStyle = "dark";                      // おどろおどろしいスタイルのみ
function themeNow(){
  const t = gameStyle === "dark" ? THEMES_DARK : THEMES;
  return t[(stage - 1) % t.length];
}
let state = "title";                         // title | play | over
let best = 0;

let player, bullets, gates, enemies, parts, meters, speed, spawnDist, shootT, shake, flash, killCount;
let bosses, bossFight, bossWarnT, nextBossAt, floats, bossShots, slashes, waves;
let stage, stageStartM, stageBannerT;
let chainN, chainLane, gateRowsThisStage, captives, blasts, corpses, raiders;
// 武器を持っている味方の数(幹部は全員拳銃以上を装備。特攻は近接武器を持つ者のみ)
function armedCount(){
  let m = 0;
  for (const st of (player.melee || [])) m += st.n;
  return player.count + Math.min(m, raiders ? raiders.length : 0);
}
// i番目の特攻隊員が持つ近接武器(近接武器の在庫を先頭から順に割り当て。無ければ素手=0)
function raiderMid(i){
  let acc = 0;
  for (const st of (player.melee || [])){
    acc += st.n;
    if (i < acc) return st.mid;
  }
  return 0;
}
let resumeStage = 1;                         // ゲームオーバーになったステージから再開する

function reset(){
  // count = 幹部の人数(全員デフォルトで拳銃持ち)。特攻部隊は raiders に入る
  player  = { x: W/2, y: 570, count: 1, weapons: [], melee: [], peak: 1, inv: 0 };
  raiders = [];                              // 特攻部隊(前線に突撃して直接攻撃する)
  captives = [];                             // (旧演出用・未使用)
  blasts = [];                               // 手榴弾の爆発範囲エフェクト
  corpses = [];                              // 倒れた敵と血だまり
  chainN = 0; chainLane = 0; gateRowsThisStage = 0;
  bullets = [];
  gates   = [];
  enemies = [];
  parts   = [];                              // パーティクル
  meters  = 0;
  speed   = 48;
  spawnDist = 30;                            // 開始3秒以内に最初のレーンが出る
  shootT  = 0;
  shake   = 0;
  flash   = 0;
  killCount = 0;
  spawnKind = 0;
  bosses = [];
  bossFight = false;
  bossWarnT = 0;
  nextBossAt = DIFF.bossDist;                // 各ステージのボス出現距離(コンフィグで変更可)
  floats = [];                               // 浮かぶテキスト
  bossShots = [];
  slashes = [];                              // 斬撃エフェクト
  waves = [];                                // 武器の衝撃波
  stage = resumeStage;                       // 前回倒れたステージから再開
  stageStartM = 0;
  stageBannerT = 1.4;                        // 開始時に STAGE n 表示
}
// ステージ内の進行距離 + ステージ数に応じた難易度係数
function effDiff(){
  return (meters - stageStartM) + (stage - 1) * 100;
}
let spawnKind = 0;
reset();

// ================= 入力 =================
// 画面のどこを触ってもOKな相対ドラッグ方式。
// ポインター/タッチ両対応で、ブラウザのスクロールに奪われないようにする。
let dragging = false, dragStartX = 0, dragStartY = 0, dragStartPX = 0, dragStartPY = 0;
function toGameX(clientX){
  const r = cv.getBoundingClientRect();
  return (clientX - r.left) / scale;
}
function toGameY(clientY){
  const r = cv.getBoundingClientRect();
  return (clientY - r.top) / scale;
}
function beginDrag(clientX, clientY){
  dragging = true;
  dragStartX = toGameX(clientX);
  dragStartY = toGameY(clientY);
  dragStartPX = player.x;
  dragStartPY = player.y;
}
function onDown(clientX, clientY){
  if (state === "title") { state = "play"; reset(); beginDrag(clientX, clientY); return; }
  if (state === "over" || state === "win"){
    if (overT > 0.6){ state = "play"; reset(); beginDrag(clientX, clientY); }
    return;
  }
  beginDrag(clientX, clientY);
}
function onMove(clientX, clientY, pressed){
  if (state !== "play") return;
  // pointerdown を取り逃していても、押しながらの移動を検知したらその場からドラッグ開始
  if (!dragging){
    if (pressed) beginDrag(clientX, clientY);
    return;
  }
  const dx = toGameX(clientX) - dragStartX;
  const dy = toGameY(clientY) - dragStartY;
  movePlayer(dragStartPX + dx * 1.4, dragStartPY + dy * 1.4);  // 少し感度を高めに
}
function onUp(){ dragging = false; }

if (window.PointerEvent){
  window.addEventListener("pointerdown", e => { e.preventDefault(); onDown(e.clientX, e.clientY); }, { passive:false });
  window.addEventListener("pointermove", e => { e.preventDefault(); onMove(e.clientX, e.clientY, e.buttons > 0 || e.pointerType === "touch"); }, { passive:false });
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
} else {
  window.addEventListener("touchstart", e => { e.preventDefault(); onDown(e.touches[0].clientX, e.touches[0].clientY); }, { passive:false });
  window.addEventListener("touchmove",  e => { e.preventDefault(); if (e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY, true); }, { passive:false });
  window.addEventListener("touchend", onUp);
  window.addEventListener("touchcancel", onUp);
  window.addEventListener("mousedown", e => onDown(e.clientX, e.clientY));
  window.addEventListener("mousemove", e => onMove(e.clientX, e.clientY, e.buttons > 0));
  window.addEventListener("mouseup", onUp);
}
// iOSのスクロール・バウンス・ピンチをゲーム画面では常に無効化
window.addEventListener("touchmove", e => e.preventDefault(), { passive:false });
document.addEventListener("gesturestart", e => e.preventDefault());
window.addEventListener("keydown", e => {
  if (state === "play"){
    if (e.key === "ArrowLeft")  movePlayer(player.x - 22, player.y);
    if (e.key === "ArrowRight") movePlayer(player.x + 22, player.y);
    if (e.key === "ArrowUp")    movePlayer(player.x, player.y - 22);
    if (e.key === "ArrowDown")  movePlayer(player.x, player.y + 22);
  } else if (e.key === " " || e.key === "Enter"){
    if (state === "title" || ((state === "over" || state === "win") && overT > 0.6)){ state = "play"; reset(); }
  }
});
function movePlayer(x, y){
  // 隊列が大きくても(戦車を持っていても)左右の端まで動けるように、移動制限は小さめの固定幅
  // (外側の列や戦車は道路の路肩にはみ出してもOK)
  const half = Math.min(squadHalfWidth(), 28);
  player.x = Math.max(ROAD_L + half, Math.min(ROAD_R - half, x));
  // 前後(上下)には移動できない。動けるのは左右だけ
}

// ================= 部隊の隊列 =================
// 兵士数とアイコン数を完全に一致させる。人数が増えると自動で密集して縮小表示。
let _fCache = { n: -1 };
function formationData(n){
  if (_fCache.n === n) return _fCache;
  // 6列隊形(半分サイズで中央寄りに密集)
  const colX = [-13, 13, -39, 39, -65, 65];    // 中央寄りから埋まる(幹部は大きめ表示)
  const pts = [];
  let i = 0, row = 0;
  while (i < n){
    const inRow = Math.min(n - i, 6);
    let mean = 0;                              // 各行を中央揃えにする
    for (let k = 0; k < inRow; k++) mean += colX[k];
    mean /= inRow;
    for (let k = 0; k < inRow; k++){
      pts.push({ x: colX[k] - mean, y: row * 25 });
      i++;
    }
    row++;
  }
  let half = 14, maxY = 0;
  for (const p of pts){ half = Math.max(half, Math.abs(p.x) + 12); maxY = Math.max(maxY, p.y); }
  _fCache = { n, s: 1, pts, half, maxY };
  return _fCache;
}
function squadHalfWidth(){
  return formationData(player.count).half;
}
// 隊列の最後尾の位置
function squadRearY(){
  return player.y + formationData(player.count).maxY * 0.8 + 24;
}
// i番目の武器の持ち手の位置(最後尾に3列で並ぶ。中央から埋まる)
const HOLDER_COLS = [0, -1, 1];
function holderPos(i){
  const ry = squadRearY();
  const col = HOLDER_COLS[i % 3], row = Math.floor(i / 3);
  return { x: player.x + col * 32, y: ry + row * 20 };
}
// 手前(下)に来るほど大きく見える遠近スケール
function depthK(y){
  return 0.72 + 0.55 * Math.max(0, Math.min(1, y / H));
}

// ================= スポーン =================
function scaledVal(base, growth){
  return base + Math.floor(effDiff() / growth);
}
function randMul(){
  // ×は常に1以上(×1.00〜×1.20)。マイナス方向の役割は÷が担う
  return Math.round((1 + Math.random() * 0.2) * 100) / 100;
}
function gateVal(){
  // 宝箱の数字 = 必要射撃回数 = 武器を持っている兵士の数 × 1〜valMulMax倍(ランダム、整数)
  return Math.max(1, armedCount()) * (1 + Math.floor(Math.random() * DIFF.valMulMax));
}
function gateGain(){
  return 1 + Math.floor(Math.random() * DIFF.gainMax);  // 檻から出てくる仲間の人数
}
function randKind(){
  // 特攻:幹部 = assaultW:officerW の比率で出現
  return Math.random() < DIFF.assaultW / (DIFF.assaultW + DIFF.officerW) ? "assault" : "officer";
}
function randWpn(){
  const r = Math.random();
  if (r < 0.13) return 1;                    // ライフル
  if (r < 0.25) return 2;                    // マシンガン
  if (r < 0.36) return 3;                    // ショットガン
  if (r < 0.46) return 4;                    // 大砲
  if (r < 0.56) return 5;                    // レーザー
  if (r < 0.65) return 6;                    // ロケットランチャー
  if (r < 0.74) return 7;                    // 戦車
  if (r < 0.83) return 8;                    // 手榴弾
  if (r < 0.92) return 9;                    // 火炎放射
  return 10;                                 // 毒ガス
}
function makeGatePair(){
  // 人(幹部/特攻)と武器(銃/近接)の宝箱。特攻:幹部 = 3:1(コンフィグで変更可)
  function one(){
    if (Math.random() < DIFF.peopleShare)
      return { op:"add", kind: randKind(), val: gateVal(), gain: gateGain(), used:false, hits:0 };
    // もらえる武器の数は1〜wpnMaxで固定(撃っても増えない)
    const wn = 1 + Math.floor(Math.random() * DIFF.wpnMax);
    if (Math.random() < DIFF.meleeShare)
      return { op:"mwpn", mid: 1 + Math.floor(Math.random() * 3), val: gateVal(), wn, used:false, hits:0 };
    return { op:"wpn", wid: randWpn(), val: gateVal(), wn, used:false, hits:0 };
  }
  // 3枠それぞれに「ある/ない」のランダム性を持たせる
  const slots = [];
  for (let i = 0; i < LANES; i++) slots.push(Math.random() < 0.6 ? one() : null);
  if (!slots.some(s => s)) slots[Math.floor(Math.random() * LANES)] = one();
  // 武器は1行に1つまで
  let seenW = false;
  for (let i = 0; i < LANES; i++){
    if (slots[i] && (slots[i].op === "wpn" || slots[i].op === "mwpn")){
      if (seenW) slots[i] = { op:"add", kind: randKind(),
        val: gateVal(), gain: gateGain(), used:false, hits:0 };
      seenW = true;
    }
  }
  // ステージ最初の3行は、最大3発でゲットできる軽い宝箱にする
  if (gateRowsThisStage < 3){
    for (const s of slots) if (s) s.val = 1 + Math.floor(Math.random() * 3);
  }
  gateRowsThisStage++;
  gates.push({ y: -60, slots });
}
function makeEnemy(forceMid){
  // 装甲兵(強い敵)はステージ1から多め、ステージが進むほどさらに増える
  const mid = forceMid === true ? true
    : Math.random() < Math.min(DIFF.midBase + (stage - 1) * DIFF.midPerStage, DIFF.midCap);
  let n = DIFF.enemyBase + Math.floor(effDiff() / Math.max(1, DIFF.enemyDiv)) + Math.floor(Math.random()*4);
  if (mid) n = Math.max(2, Math.round(n * 0.6));
  const x = ROAD_L + 50 + Math.random() * (ROAD_R - ROAD_L - 100);
  // 攻撃タイプ: 殴る / 口から毒を吐く / 斧(装甲兵は斧持ちが多い)
  const rA = Math.random();
  const atype = mid ? (rA < 0.6 ? "axe" : rA < 0.8 ? "punch" : "poison")
                    : (rA < 0.55 ? "punch" : rA < 0.85 ? "poison" : "axe");
  enemies.push({ x, y: -50, count: n, wob: Math.random()*6.28,
    atkT: 0.4 + Math.random() * 0.5, atype, swingT: 0,
    hpPer: mid ? 3 : 1, hpBuf: 0, maxHp: n * (mid ? 3 : 1) });
}
// 特攻部隊: 隊列にとどまらず前線へ突撃し、敵に直接攻撃を仕掛ける
function spawnRaider(){
  if (raiders.length >= 60) return;
  raiders.push({ x: player.x + (Math.random() - 0.5) * 70,
    y: player.y - 40 - Math.random() * 30,
    wob: Math.random() * 6.28, atkT: 0.3, dead: false });
}
function updateRaiders(dt){
  if (raiders.length === 0) return;
  // グループ全体で1つの標的を決めて、隊で襲いかかる
  const gcx = raiders.reduce((a, r) => a + r.x, 0) / raiders.length;
  const gcy = raiders.reduce((a, r) => a + r.y, 0) / raiders.length;
  let tgt = null, td = 1e9;
  for (const en of enemies){
    if (en.count <= 0) continue;
    const er2 = enemyRadius(en);
    if (en.y - er2 < 0) continue;
    const d = Math.hypot(en.x - gcx, en.y - gcy);
    if (d < td){ td = d; tgt = { x: en.x, y: en.y, en, r: er2 }; }
  }
  for (const bb of bosses){
    if (bb.y - bb.r < 0) continue;
    const d = Math.hypot(bb.x - gcx, bb.y - gcy);
    if (d < td){ td = d; tgt = { x: bb.x, y: bb.y, boss: bb, r: bb.r }; }
  }
  for (let ri = 0; ri < raiders.length; ri++){
    const rd = raiders[ri];
    rd.wob += dt * 5;
    if (tgt){
      // 標的の下側を囲む「持ち場」へ整列して襲いかかる(フラフラしない)
      const slot = (ri % 7) - 3;
      const ring = Math.floor(ri / 7);
      const ang = Math.PI / 2 + slot * 0.3;
      const rr2 = tgt.r + 13 + ring * 20;
      const px2 = tgt.x + Math.cos(ang) * rr2;
      const py2 = tgt.y + Math.sin(ang) * rr2;
      const dx = px2 - rd.x, dy2 = py2 - rd.y, dl = Math.hypot(dx, dy2) || 1;
      if (dl > 5){                                // 持ち場へ直進(全員同じ速度でゆっくり)
        const sp = Math.min(65, dl / dt);
        rd.x += dx / dl * sp * dt;
        rd.y += dy2 / dl * sp * dt;
      }
      // 標的に届く距離なら攻撃
      const adx = tgt.x - rd.x, ady = tgt.y - rd.y;
      const adl = Math.hypot(adx, ady) || 1;
      if (adl < tgt.r + 22){
        rd.atkT -= dt;
        if (rd.atkT <= 0){
          const mw = MELEE[raiderMid(ri)];
          rd.atkT = mw.rate;
          addSlash(rd.x + (adx / adl) * 10, rd.y + (ady / adl) * 10 - 6);
          burst(tgt.x - (adx / adl) * tgt.r * 0.5, tgt.y - (ady / adl) * tgt.r * 0.5, "#ffd9a8", 4);
          if (tgt.en){
            const en = tgt.en;
            en.hpBuf = (en.hpBuf || 0) + mw.dmg;
            let mk = 0;
            while (en.hpBuf >= (en.hpPer || 1) && en.count > 0){
              en.hpBuf -= (en.hpPer || 1);
              en.count--; killCount++; mk++;
            }
            if (mk > 0) dropCorpses(en, mk);
          } else {
            tgt.boss.hp -= mw.dmg;
          }
        }
      }
    } else {
      // 敵がいない間は隊列の少し前に整列して待機(こちらも同じ速度で移動)
      const hx = player.x + ((ri % 5) - 2) * 24;
      const hy = player.y - 170 - Math.floor(ri / 5) * 24;
      const dxh = hx - rd.x, dyh = hy - rd.y, dlh = Math.hypot(dxh, dyh) || 1;
      const sph = Math.min(65, dlh / dt);
      rd.x += dxh / dlh * sph * dt;
      rd.y += dyh / dlh * sph * dt;
    }
    // 生きている間は敵より上(奥)へは行かない
    if (tgt && rd.y < tgt.y + 6) rd.y = tgt.y + 6;
    if (!tgt) rd.y = Math.max(rd.y, 300);
    rd.x = Math.max(ROAD_L + 12, Math.min(ROAD_R - 12, rd.x));
    rd.y = Math.max(60, Math.min(H - 40, rd.y));
  }
  raiders = raiders.filter(r => !r.dead);
}
// 毒ブレス: 口から短い毒の息を吐く(近距離のみ、遠くへは飛ばない)
function breathAttack(x, y, dmg){
  const dxb = player.x - x, dyb = player.y - y;
  const base = Math.atan2(dyb, dxb);
  for (let i = 0; i < 7; i++){
    const sp = 140 + Math.random() * 70;
    const ca = base + (Math.random() - 0.5) * 0.55;
    waves.push({ x, y, vx: Math.cos(ca) * sp, vy: Math.sin(ca) * sp,
      kind: "breath", dmg, ttl: 0.8 + Math.random() * 0.15, wide: 18 });
  }
}
function addSlash(x, y){
  slashes.push({ x, y, t: 0.22, ang: Math.random() * 0.8 - 0.4 });
}
// 敵がやられたら、その場で倒れ込む(血が地面に広がる)
function dropCorpses(en, k){
  const r = enemyRadius(en);
  for (let i = 0; i < Math.min(k, 3); i++){
    if (corpses.length > 45) corpses.shift();
    corpses.push({ x: en.x + (Math.random() - 0.5) * r * 1.4,
      y: en.y + (Math.random() - 0.5) * r * 0.8,
      rot: (Math.random() - 0.5) * 0.7, t: 2.6, mid: (en.hpPer || 1) > 1 });
  }
}
// 手榴弾の爆発: 半径内の敵・ボス全員にダメージ
function explodeGrenade(x, y){
  burst(x, y, "#a8d86b", 22);
  burst(x, y, "#ffd76b", 14);
  blasts.push({ x, y, t: 0.4, max: 95 });   // 爆発範囲のUI(広がる輪)
  shake = Math.max(shake, 0.18);
  for (const en of enemies){
    if (en.count <= 0) continue;
    if (en.y - enemyRadius(en) < 0) continue;       // 完全出現前の敵には爆風も無効
    if (Math.hypot(en.x - x, en.y - y) < 95){
      const d = Math.min(5, en.count);
      en.count -= d; killCount += d;
      if (d > 0) dropCorpses(en, d);
      burst(en.x, en.y, "#ffb3b3", 5);
    }
  }
  for (const bb of bosses){
    if (bb.y - bb.r < 0) continue;                  // 完全出現前のボスにも無効
    if (Math.hypot(bb.x - x, bb.y - y) < 95 + bb.r * 0.5) bb.hp -= 5;
  }
}
// 武器の衝撃波: 兵士に届くと兵士が減る
function updateWaves(dt){
  for (const wv of waves){
    wv.x += wv.vx * dt;
    wv.y += wv.vy * dt;
    if (wv.ttl !== undefined){                    // 毒ブレスは短い距離で消える
      wv.ttl -= dt;
      if (wv.ttl <= 0){ wv.dead = true; continue; }
    }
    if (wv.kind === "bomb"){
      // 爆弾: 着弾地点で爆発、近くにいると爆風ダメージ
      wv.fuse -= dt;
      if (wv.fuse <= 0 && !wv.dead){
        wv.dead = true;
        burst(wv.x, wv.y, "#ff9c5c", 24);
        burst(wv.x, wv.y, "#ffd76b", 16);
        shake = Math.max(shake, 0.25);
        if (Math.hypot(wv.x - player.x, wv.y - player.y) < 85){
          addSlash(player.x, player.y - 24);
          damagePlayer(wv.dmg, "#ff9c9c");
        }
      }
      continue;
    }
    if (!wv.dead && Math.abs(wv.y - player.y) < 22
        && Math.abs(wv.x - player.x) < squadHalfWidth() + (wv.wide || (wv.big ? 22 : (wv.kind === "shot" ? 8 : 12)))){
      wv.dead = true;
      addSlash(player.x, player.y - 24);
      damagePlayer(wv.dmg, "#ff9c9c");
      shake = Math.max(shake, wv.big ? 0.25 : 0.1);
    }
  }
  waves = waves.filter(wv => !wv.dead && wv.y < H + 40 && wv.y > -40 && wv.x > -40 && wv.x < W + 40);
}
function spawnStep(dy){
  if (bossWarnT > 0 || stageBannerT > 0.7) return;  // 予告・暗転中のみ停止(明転したらすぐ出る)
  spawnDist -= dy;
  if (spawnDist <= 0){
    if (bossFight){                                // ボス戦は雑魚+強め雑魚の混成部隊が湧く
      if (Math.random() < 0.25){ makeGatePair(); spawnDist = 1000; }
      else {
        makeEnemy();
        if (Math.random() < 0.5) makeEnemy(true);  // 装甲つきの強め雑魚も一緒に
        spawnDist = 120;
      }
    }
    // +1レーンの連続区間(隙間なく並ぶ)
    else if (chainN > 0){
      makeChainRow(); chainN--; spawnKind = 1; spawnDist = 30;
    }
    else if (spawnKind === 0 || Math.random() < 0.55){
      if (Math.random() < 0.05){                   // まれに+1が連続する区間(5〜20枚)が始まる
        chainN = 2 + Math.floor(Math.random() * 8);   // 3〜10枚(獲得量を半減)
        chainLane = Math.floor(Math.random() * LANES);
        makeChainRow(); spawnDist = 30;
      } else {
        makeGatePair(); spawnDist = 250;
      }
      spawnKind = 1;
    }
    else {
      // 緑の連続パネル帯が画面上部にある間は敵を出さない(重なり防止)
      if (gates.some(g => g.y < 170 && g.slots.some(s => s && s.chain))){
        spawnDist = 120;
      } else {
        // 五月雨ではなく、団体でゾロゾロと一斉に襲ってくる
        const gN = 3 + Math.floor(Math.random() * 2);        // 3〜4グループの大群
        for (let gi = 0; gi < gN; gi++){
          makeEnemy(gi === gN - 1 && Math.random() < 0.5);   // 群れの後方に装甲兵が混ざる
          const en2 = enemies[enemies.length - 1];
          en2.x = ROAD_L + 55 + (gi % 3 + 0.5) * (ROAD_R - ROAD_L - 110) / 3 + (Math.random() - 0.5) * 24;
          en2.y = -50 - Math.floor(gi / 3) * 85 - Math.random() * 25;
        }
        spawnKind = 0;
        spawnDist = 430;                                     // 大群のあとは次の団体まで間隔を空ける
      }
    }
  }
}
// 同じレーンに+1だけが並ぶ行(緑パネル・撃っても育たない)
function makeChainRow(){
  const slots = [null, null, null].slice(0, LANES);
  slots[chainLane] = { op:"add", val: 1, used:false, hits:0, chain: true };
  gates.push({ y: -60, slots });
}

// ================= パーティクル =================
function burst(x, y, color, n){
  for (let i = 0; i < n; i++){
    const a = Math.random() * 6.28, s = 60 + Math.random()*160;
    parts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, t: 0.4 + Math.random()*0.3, color });
  }
}

// ================= 更新 =================
let overT = 0;
function applyGate(g){
  if (g.op === "add") player.count += Math.floor(g.val);   // 実際の増減は整数部分
  if (g.op === "sub") player.count -= Math.floor(g.val);
  player.count = Math.min(player.count, 10);               // 幹部は最大10人
  player.count = Math.min(player.count, 10);
  if (player.count <= 0){
    // マイナス系バーでは全滅させない: 1人残してゲーム続行
    player.count = 1;
    floats.push({ x: player.x, y: player.y - 55, text: "残り1人!", color: "#ff6b6b", t: 1.4 });
    shake = Math.max(shake, 0.35); flash = Math.max(flash, 0.3);
  }
}
function gameOver(){
  state = "over"; overT = 0;
  resumeStage = stage;                       // リトライは同じステージから
  best = Math.max(best, stage);              // ベストは到達ステージで記録
  shake = 0.5; flash = 0.6;
  burst(player.x, player.y, "#6ec1ff", 40);
}

function update(dt){
  if (state !== "play"){ if (state === "over" || state === "win") overT += dt; updateFx(dt); return; }

  meters += (speed * dt) / 10;
  speed = Math.min(DIFF.speedBase + effDiff() * DIFF.speedFactor, DIFF.speedCap);
  if (stageBannerT > 0) stageBannerT -= dt;
  const dy = speed * dt;

  player.inv = Math.max(0, player.inv - dt);     // 被弾後の無敵時間を減らす
  player.peak = Math.max(player.peak || 1, player.count);   // 体力ゲージ用の最大人数
  // 持ち手より多い武器は捨てずに「保管中」になる(人数が増えたら自動で装備される)
  // 倒れた敵は道と一緒に流れて消える
  for (const c of corpses){ c.y += dy; c.t -= dt; }
  corpses = corpses.filter(c => c.t > 0 && c.y < H + 40);

  spawnStep(dy);
  updateBoss(dt);
  updateWaves(dt);
  updateRaiders(dt);

  // 射撃: 幹部は全員が射撃する。デフォルトは拳銃、手に入れた銃は後方の幹部が持ち替える
  const fAll = formationData(player.count);
  let specialTotal = 0;
  for (const st of player.weapons) specialTotal += st.n;
  specialTotal = Math.min(specialTotal, player.count);
  const pistolN = player.count - specialTotal;
  // 拳銃部隊(前方の幹部)
  shootT -= dt;
  if (shootT <= 0){
    const pw = WEAPONS[0];
    shootT = pw.rate;
    const emitP = Math.min(pistolN, 24);
    for (let k = 0; k < emitP; k++){
      const p = fAll.pts[k];
      bullets.push({ x: player.x + p.x, y: player.y + p.y * 0.8 - 12,
        vx: 0, vy: -pw.bspd, dmg: pw.dmg, wi: 0, pierce: 0 });
    }
  }
  // 特殊武器部隊(後方の幹部)
  let slotsLeft = specialTotal;
  let armIdx = 0;                                         // 特殊武器持ちの通し番号
  for (const st of player.weapons){
    const shooters = Math.min(st.n, slotsLeft);
    slotsLeft -= shooters;
    if (shooters <= 0) continue;
    const myBase = armIdx;
    armIdx += shooters;
    const w = WEAPONS[st.wid];
    st.t = (st.t || 0) - dt;
    if (st.t > 0) continue;
    st.t = w.rate;
    const emit = Math.min(shooters, w.spread ? 8 : 24);   // 同時発射数の上限
    let mp = null;
    for (let k = 0; k < emit; k++){
      const p = fAll.pts[Math.min(pistolN + myBase + k, fAll.pts.length - 1)];
      const fx0 = player.x + p.x + (w.jitter ? (Math.random() - 0.5) * 6 : 0);
      const fy0 = player.y + p.y * 0.8 - 14;
      if (!mp) mp = { x: fx0, y: fy0 };
      if (w.stream){                               // 火炎放射・毒ガスは扇状の短射程ストリーム
        const svx = (Math.random() - 0.5) * 100;
        bullets.push({ x: fx0, y: fy0, vx: svx, vy: -w.bspd * (0.85 + Math.random() * 0.3),
          dmg: w.dmg, wi: st.wid, pierce: 0 });
      } else if (w.pierce){                        // レーザーは斜めに発射(壁で反射する)
        st.dir = -(st.dir || 1);
        bullets.push({ x: fx0, y: fy0, vx: st.dir * 260, vy: -w.bspd * 0.75,
          dmg: w.dmg, wi: st.wid, pierce: w.pierce });
      } else if (w.spread){
        for (const vx of [-90, 0, 90])
          bullets.push({ x: fx0, y: fy0, vx, vy: -w.bspd, dmg: w.dmg, wi: st.wid, pierce: 0 });
      } else {
        bullets.push({ x: fx0, y: fy0, vx: 0, vy: -w.bspd, dmg: w.dmg, wi: st.wid, pierce: w.pierce || 0 });
      }
    }
    // マズルフラッシュ(その武器の持ち手の位置で光る)
    if (mp){
      const heavy = w.cannon || w.missile;
      burst(mp.x, mp.y - 6, w.color, heavy ? 10 : (w.spread ? 6 : 3));
      if (heavy) shake = Math.max(shake, 0.07);
    }
  }

  // 弾
  for (const b of bullets){
    b.y += b.vy * dt;
    b.x += (b.vx || 0) * dt;
    const bw2 = WEAPONS[b.wi || 0];
    // レーザーは道路の壁で反射する
    if (bw2.pierce){
      if (b.x < ROAD_L + 3){
        b.x = ROAD_L + 3 + (ROAD_L + 3 - b.x);
        b.vx = Math.abs(b.vx || 260);
        burst(ROAD_L + 3, b.y, "#8affe9", 4);
      } else if (b.x > ROAD_R - 3){
        b.x = ROAD_R - 3 - (b.x - (ROAD_R - 3));
        b.vx = -Math.abs(b.vx || 260);
        burst(ROAD_R - 3, b.y, "#8affe9", 4);
      }
    }
    // 火炎放射・毒ガスは射程が短い(飛びすぎたら消える)
    if (bw2.stream){
      b.trav = (b.trav || 0) + Math.hypot(b.vx || 0, b.vy) * dt;
      if (b.trav > bw2.range) b.dead = true;
    }
    // 手榴弾は一定距離飛ぶと空中で爆発(範囲攻撃)
    if (bw2.grenade){
      b.trav = (b.trav || 0) + Math.hypot(b.vx || 0, b.vy) * dt;
      if (!b.dead && b.trav > 270){ explodeGrenade(b.x, b.y); b.dead = true; }
    }
    // ロケットは煙の尾を引く
    if (bw2.missile && Math.random() < 0.45)
      parts.push({ x: b.x + (Math.random()-0.5)*4, y: b.y + 8, vx: (Math.random()-0.5)*20, vy: 50, t: 0.35, color: "#9aa4b2" });
  }

  // ゲート
  for (const g of gates){
    g.y += dy;
    for (const s of g.slots) if (s){ if (s.flash > 0) s.flash -= dt; if (s.cool > 0) s.cool -= dt; }
    // 弾との当たり: 誰の弾でもOK。数字(必要射撃回数)を撃ち切ると中身をゲット!
    for (const b of bullets){
      if (b.dead || g.y < b.y - 26 || g.y > b.y + 6) continue;
      const lane = laneAt(b.x);
      const side = g.slots[lane];
      if (!side || side.used) continue;
      if (side.chain) continue;                    // 緑の連続パネルは撃たずに通過で取る
      b.dead = true;
      side.flash = 0.22;                           // 被弾中の宝箱は光って震える
      side.val -= 1;
      if (side.val <= 0){                          // 撃ち切った! 宝箱が開く
        side.used = true;
        const ccx = ROAD_L + (lane + 0.5) * laneW();
        if (side.op === "wpn"){
          // 銃器: 幹部が拳銃から持ち替える
          player.weapons.push({ wid: side.wid, n: Math.max(1, side.wn || 1), t: 0 });
          if (player.weapons.length > 6) player.weapons.shift();
          floats.push({ x: player.x, y: player.y - 70,
            text: WEAPONS[side.wid].name + "×" + side.wn + " 回収!", color: "#ffd76b", t: 1.4 });
          burst(ccx, g.y - 20, "#ffd76b", 18);
        } else if (side.op === "mwpn"){
          // 近接武器: 特攻部隊が装備する
          player.melee.push({ mid: side.mid, n: Math.max(1, side.wn || 1) });
          if (player.melee.length > 6) player.melee.shift();
          floats.push({ x: player.x, y: player.y - 70,
            text: MELEE[side.mid].name + "×" + side.wn + " 回収!(特攻用)", color: "#c8d2e4", t: 1.4 });
          burst(ccx, g.y - 20, "#c8d2e4", 18);
        } else if (side.kind === "assault"){
          for (let q = 0; q < side.gain; q++) spawnRaider();
          floats.push({ x: player.x, y: player.y - 55,
            text: "特攻部隊 +" + side.gain + "人!", color: "#ff9c7a", t: 1.3 });
          burst(ccx, g.y - 20, "#ff9c7a", 18);
        } else {
          // 幹部は最大10人
          const room = 10 - player.count;
          if (room <= 0){
            floats.push({ x: player.x, y: player.y - 55,
              text: "幹部はすでにMAXです!", color: "#ffd76b", t: 1.5 });
            burst(ccx, g.y - 20, "#9aa4b8", 10);
          } else {
            const got = Math.min(side.gain, room);
            player.count += got;
            floats.push({ x: player.x, y: player.y - 55,
              text: "幹部 +" + got + "人!" + (player.count >= 10 ? "(MAX)" : ""), color: "#5df08d", t: 1.3 });
            burst(ccx, g.y - 20, "#5df08d", 18);
          }
        }
        // 同じ行の他の宝箱はそのまま残る(続けて撃ち切れば全部取れる)
      }
    }
    // 通過判定: 緑の連続パネルだけは通過で+1(宝箱は撃ち切りでのみ取得)
    if (!g.applied && g.y >= player.y - 8){
      g.applied = true;
      const side = g.slots[laneAt(player.x)];
      if (side && side.chain && !side.used){
        side.used = true;
        applyGate(side);
        burst(player.x, player.y - 20, "#5df08d", 12);
      }
    }
  }
  gates = gates.filter(g => g.y < H + 80);

  // 敵: プレイヤーめがけて突進し、間合いに入ると殴る/毒を吐く/斧で攻撃する
  for (const en of enemies){
    en.wob += dt * 4;
    const er = enemyRadius(en);
    if (en.count > 0){
      const dxc = player.x - en.x, dyc = player.y - en.y;
      const dl = Math.hypot(dxc, dyc) || 1;
      const charge = DIFF.chargeBase + (stage - 1) * DIFF.chargePerStage;   // 突進速度(ステージで加速)
      // ノシノシと踏みしめるリズムで迫ってくる
      const stomp = 0.45 + 0.55 * Math.abs(Math.sin(en.wob * 1.2));
      en.x += (dxc / dl) * charge * 0.7 * stomp * dt;
      // 下に迫ってくるスピードは3割遅め
      en.y += (dy * 0.9 + Math.max(0, dyc / dl) * charge * stomp * dt) * 0.7;
      // レーン(宝箱の行)を追い越して先に襲ってこない: レーンが通り過ぎるまで奥で待つ
      let blockY = Infinity;
      for (const g of gates){
        if (g.y < player.y - 60 && g.y > en.y - 24 && g.slots.some(s => s && !s.used)){
          blockY = Math.min(blockY, g.y);
        }
      }
      if (blockY < Infinity && en.y > blockY - 48) en.y = blockY - 48;
      // 攻撃タイプごとの間合いで止まる(毒吐きは少し離れた所から吐く)
      const reach = en.atype === "poison" ? er * 0.5 + 95 : er * 0.5 + 22;
      const stopY = player.y - reach;
      if (en.y > stopY) en.y = stopY;
      en.swingT = Math.max(0, (en.swingT || 0) - dt);
      const aligned = Math.abs(en.x - player.x) < er + squadHalfWidth() + 6;
      if (en.y - er > 0 && en.y >= stopY - 14 && aligned){
        en.atkT -= dt;
        if (en.atkT <= 0){
          en.swingT = 0.25;
          if (en.atype === "poison"){              // 口から毒を吐く(近距離ブレス)
            en.atkT = 2.0 + Math.random() * 0.4;
            breathAttack(en.x, en.y + er * 0.35, 1);
          } else {                                 // 殴る / 斧を振り下ろす
            en.atkT = en.atype === "axe" ? 1.5 : 1.0;
            addSlash(player.x, player.y - 26);
            burst(player.x, player.y - 20, en.atype === "axe" ? "#cfd6e4" : "#ffb08a", 8);
            damagePlayer(1, "#ff6b6b");
            shake = Math.max(shake, 0.2);
          }
        }
      }
      // 接触している特攻隊員がいれば、そちらを攻撃して倒す
      if (en.y - er > 0){
        en.rAtkT = (en.rAtkT === undefined ? 0.7 : en.rAtkT) - dt;
        if (en.rAtkT <= 0){
          let hitR = false;
          for (const rd of raiders){
            if (rd.dead) continue;
            if (Math.hypot(rd.x - en.x, rd.y - en.y) < er + 18){
              en.rAtkT = 1.0;
              rd.dead = true;
              hitR = true;
              addSlash(rd.x, rd.y - 8);
              burst(rd.x, rd.y, "#ff6b6b", 8);
              if (corpses.length > 45) corpses.shift();
              corpses.push({ x: rd.x, y: rd.y, rot: (Math.random() - 0.5) * 0.7, t: 2.6, ally: true });
              break;
            }
          }
          if (!hitR) en.rAtkT = 0.2;             // 相手がいなければすぐ次のチェック
        }
      }
    }
    // 弾との当たり(敵が完全に画面に入ってから当たる)
    for (const b of bullets){
      if (b.dead || en.count <= 0) continue;
      const r = enemyRadius(en);
      if (en.y - r < 0) break;                      // まだ全身が見えていない敵は無敵
      if (Math.abs(b.x - en.x) < r && Math.abs(b.y - en.y) < r){
        if (b.lastHit === en) continue;                       // 貫通弾が同じ群れを連続ヒットしない
        b.lastHit = en;
        const bw = WEAPONS[b.wi || 0];
        if (bw.grenade){                                      // 手榴弾は着弾点で範囲爆発
          b.dead = true;
          explodeGrenade(b.x, b.y);
          continue;
        }
        // 中堅兵は1人あたりHP3(蓄積ダメージで倒す)
        en.hpBuf = (en.hpBuf || 0) + (b.dmg || 1);
        let bk = 0;
        while (en.hpBuf >= (en.hpPer || 1) && en.count > 0){
          en.hpBuf -= (en.hpPer || 1);
          en.count--;
          killCount++; bk++;
        }
        if (bk > 0) dropCorpses(en, bk);            // やられた敵はその場に倒れ込む
        burst(b.x, en.y + r*0.4, "#ffb3b3", (bw.cannon || bw.missile) ? 12 : 3);
        if (bw.missile){                                      // ロケランは周囲の群れにも爆風
          burst(b.x, b.y, "#ff9c5c", 16);
          for (const other of enemies){
            if (other === en || other.count <= 0) continue;
            if (other.y - enemyRadius(other) < 0) continue;
            if (Math.hypot(other.x - en.x, other.y - en.y) < 90){
              const d2 = Math.min(4, other.count);
              other.count -= d2; killCount += d2;
              if (d2 > 0) dropCorpses(other, d2);
            }
          }
          shake = Math.max(shake, 0.12);
        }
        if (b.pierce > 0) b.pierce--; else b.dead = true;     // レーザーは貫通
      }
    }
  }
  enemies = enemies.filter(en => en.count > 0 && en.y < H + 60);
  bullets = bullets.filter(b => !b.dead && b.y > -20 && b.x > ROAD_L - 24 && b.x < ROAD_R + 24);

  updateFx(dt);
}
function updateFx(dt){
  for (const p of parts){ p.t -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 300*dt; }
  parts = parts.filter(p => p.t > 0);
  for (const c of captives){ c.t -= dt; c.y -= 55 * dt; c.x += (c.vx || 0) * dt; }
  captives = captives.filter(c => c.t > 0);
  for (const bl of blasts) bl.t -= dt;
  blasts = blasts.filter(bl => bl.t > 0);
  for (const s of slashes) s.t -= dt;
  slashes = slashes.filter(s => s.t > 0);
  for (const f of floats){ f.t -= dt; f.y -= 28 * dt; }
  floats = floats.filter(f => f.t > 0);
  shake = Math.max(0, shake - dt * 1.6);
  flash = Math.max(0, flash - dt * 2);
}
function enemyRadius(en){ return 17 + Math.min(en.count, 40) * 1.2; }

// ================= ボス =================
// 敵の攻撃を受けると兵士が1人やられて、その場に倒れ込む。全滅でゲームオーバー
function damagePlayer(rawDmg, color){
  if (state !== "play") return;
  if (player.inv > 0) return;                // 被弾直後は短い無敵時間
  player.inv = 0.8;
  player.count -= 1;
  if (corpses.length > 45) corpses.shift();  // 味方も敵と同じくその場に倒れ込む(血だまり付き)
  corpses.push({ x: player.x + (Math.random() - 0.5) * 44,
    y: player.y + (Math.random() - 0.5) * 14,
    rot: (Math.random() - 0.5) * 0.7, t: 2.6, ally: true });
  shake = Math.max(shake, 0.3); flash = Math.max(flash, 0.2);
  if (player.count <= 0){ player.count = 0; gameOver(); }
}

const BOSS_WEAPONS = ["fist", "sword", "axe", "spear", "poison"];  // 飛び道具は無し
function spawnBoss(){
  const s = stage - 1;
  const totalHp = DIFF.bossHpBase + s * DIFF.bossHpPerStage + Math.floor(effDiff() * 0.15);
  const roll = Math.random();
  const n = roll < 0.45 ? 1 : roll < 0.8 ? 2 : 3;         // 1体/2体/3体
  for (let i = 0; i < n; i++){
    const sizeK = n === 1 ? (0.9 + Math.random() * 0.5)   // 単体は大きめ
               : n === 2 ? (0.7 + Math.random() * 0.3)
                         : (0.55 + Math.random() * 0.2);  // 3体は小さめ
    bosses.push({
      x: W/2 + (i - (n - 1) / 2) * 115,
      y: -80 - i * 40,
      hp: Math.ceil(totalHp / n), maxHp: Math.ceil(totalHp / n),
      r: Math.max(26, Math.round((46 + Math.min(s, 4) * 5) * sizeK)),
      wob: Math.random() * 6.28, age: 0,
      wtype: BOSS_WEAPONS[Math.floor(Math.random() * BOSS_WEAPONS.length)],
      atkT: 0.6 + Math.random() * 0.5, waveCd: 1.2 + Math.random(), swingT: 0
    });
  }
  bossFight = true;
}

function updateBoss(dt){
  // 出現予告 → 出現
  if (!bossFight && bossWarnT <= 0 && stageBannerT <= 0 && meters >= nextBossAt){
    bossWarnT = 1.4;
    shake = Math.max(shake, 0.2);
  }
  if (bossWarnT > 0){
    bossWarnT -= dt;
    if (bossWarnT <= 0) spawnBoss();
    return;
  }
  if (!bossFight) return;

  for (const b of bosses){
    b.wob += dt * 3;
    b.age += dt;

    // のしのしと一歩ずつ、まっすぐ兵士へ近づいてくる(前後移動はしない)
    const stomp = 0.35 + 0.65 * Math.abs(Math.sin(b.wob * 1.6));   // 踏みしめのリズム
    b.y += (26 + (stage - 1) * 4 + b.age * 0.8) * stomp * dt;
    if (b.age < 15 && b.y > 300) b.y = 300;          // 出現から15秒は下まで来ない

    // プレイヤー追尾(のしのし左右に揺れながら) + ボス同士は重ならない
    b.x += (player.x - b.x) * dt * 0.35 + Math.sin(b.wob * 1.6) * 16 * dt;
    for (const o of bosses){
      if (o === b) continue;
      const ddx = b.x - o.x;
      if (Math.abs(ddx) < (b.r + o.r) * 0.85 && Math.abs(b.y - o.y) < (b.r + o.r) * 0.8)
        b.x += (ddx >= 0 ? 1 : -1) * 70 * dt;
    }
    b.x = Math.max(ROAD_L + b.r*0.6, Math.min(ROAD_R - b.r*0.6, b.x));

    // 密着距離で止まる
    const meleeY = player.y - b.r - 20;
    if (b.y > meleeY) b.y = meleeY;

    // 近接攻撃
    b.swingT = Math.max(0, b.swingT - dt);
    const inMelee = b.y >= meleeY - 16 && Math.abs(b.x - player.x) < b.r + squadHalfWidth() + 10;
    if (inMelee){
      b.atkT -= dt;
      if (b.atkT <= 0){
        b.atkT = b.wtype === "fist" ? 0.6 : 0.9;   // 素手は手数が多い
        b.swingT = 0.25;
        addSlash(player.x, player.y - 30);
        addSlash(player.x + 14, player.y - 22);
        damagePlayer(1, "#ff6b6b");
        shake = Math.max(shake, 0.3); flash = Math.max(flash, 0.15);
        if (state !== "play") return;
      }
    } else if (b.wtype === "poison" && b.y - b.r > 0){
      // 毒吐きボスだけは、近づくと口から毒を吐く(遠くへは飛ばない)
      const close = player.y - b.y < b.r + 190
        && Math.abs(b.x - player.x) < b.r + squadHalfWidth() + 60;
      if (close){
        b.waveCd -= dt;
        if (b.waveCd <= 0){
          b.waveCd = 2.2;
          b.swingT = 0.25;
          breathAttack(b.x, b.y + b.r * 0.45, 1);
        }
      }
    }

    // 弾との当たり(ボスが完全に画面に入ってから当たる)
    for (const bl of bullets){
      if (bl.dead || b.hp <= 0) continue;
      if (b.y - b.r < 0) break;                     // まだ全身が見えていないボスは無敵
      if (Math.abs(bl.x - b.x) < b.r && Math.abs(bl.y - b.y) < b.r){
        bl.dead = true;
        const bw = WEAPONS[bl.wi || 0];
        if (bw.grenade){ explodeGrenade(bl.x, bl.y); continue; }  // 手榴弾はボスにも範囲爆発
        b.hp -= (bl.dmg || 1);
        if (bw.cannon || bw.missile) burst(bl.x, bl.y, "#ff9c5c", 10);
        else if (Math.random() < 0.3) burst(bl.x, bl.y, "#ffd27a", 2);
      }
    }
    if (b.hp <= 0){
      burst(b.x, b.y, "#ffd76b", 45);
      burst(b.x, b.y, "#ff8a5c", 28);
      shake = Math.max(shake, 0.4);
    }
  }
  bosses = bosses.filter(b => b.hp > 0);

  if (bosses.length === 0){                   // 全ボス撃破!
    if (stage >= 10){                         // 全10ステージ制覇!
      state = "win"; overT = 0;
      resumeStage = 1;
      best = Math.max(best, stage);
      bossFight = false;
      return;
    }
    floats.push({ x: W/2, y: 200, text: "STAGE " + stage + " クリア!", color: "#5df08d", t: 2.0 });
    flash = Math.max(flash, 0.2);
    bossFight = false;
    stage++;
    stageStartM = meters;
    stageBannerT = 2.2;
    spawnKind = 0;                           // 新ステージは必ずレーンから出現する
    player.count = 1;                        // 次のステージも幹部1人(拳銃)から
    player.peak = 1; player.inv = 0;
    player.weapons = []; player.melee = []; raiders = [];
    gates = []; enemies = []; bullets = []; bossShots = []; waves = []; corpses = [];
    spawnDist = 30;                          // 新ステージ開始3秒以内にレーンが出る
    gateRowsThisStage = 0;                   // 新ステージ最初の行はプラスから
    nextBossAt = stageStartM + DIFF.bossDist;
  }
}

// ================= 描画 =================
let roadOff = 0;
function draw(dt){
  ctx.save();
  if (shake > 0){
    ctx.translate((Math.random()-0.5)*shake*14, (Math.random()-0.5)*shake*14);
  }
  // 背景(ステージごとにテーマが変わる)
  const th = themeNow();
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0, th.bgTop); bg.addColorStop(1, th.bgBot);
  ctx.fillStyle = bg; ctx.fillRect(-10,-10,W+20,H+20);

  // 道路(遠近法: 手前が広く、奥が狭い台形)
  ctx.fillStyle = th.road;
  ctx.beginPath();
  ctx.moveTo(px(ROAD_L, 0), 0);
  ctx.lineTo(px(ROAD_R, 0), 0);
  ctx.lineTo(ROAD_R, H);
  ctx.lineTo(ROAD_L, H);
  ctx.closePath(); ctx.fill();
  // 路肩ライン
  ctx.strokeStyle = th.edge;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(px(ROAD_L, 0), 0); ctx.lineTo(ROAD_L, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px(ROAD_R, 0), 0); ctx.lineTo(ROAD_R, H); ctx.stroke();
  // レーン区切り線(奥に向かって収束する)
  if (state === "play") roadOff = (roadOff + speed*dt) % 46;
  ctx.strokeStyle = th.dash;
  ctx.lineWidth = 3; ctx.setLineDash([22, 24]); ctx.lineDashOffset = -roadOff;
  for (let i = 1; i < LANES; i++){
    const lx = ROAD_L + i * laneW();
    ctx.beginPath(); ctx.moveTo(px(lx, 0), 0); ctx.lineTo(lx, H); ctx.stroke();
  }
  ctx.setLineDash([]);

  // 倒れ込んだ敵と血だまり(地面の演出なのでゲートより先に描く)
  for (const c of corpses){
    beginPersp(c.x, c.y);
    const age = 2.6 - c.t;
    ctx.globalAlpha = Math.min(0.6, Math.max(0, c.t * 0.45));    // 血だまり(徐々に広がる)
    ctx.fillStyle = "#6e1414";
    const br2 = 5 + Math.min(1, age * 2.0) * 9;
    ctx.beginPath(); ctx.ellipse(c.x, c.y + 3, br2, br2 * 0.42, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#8e1c1c";
    ctx.beginPath(); ctx.ellipse(c.x + 3, c.y + 4, br2 * 0.45, br2 * 0.2, 0, 0, 6.283); ctx.fill();
    ctx.globalAlpha = Math.max(0, Math.min(1, c.t * 1.3));       // 倒れ込んだ兵士
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(1.5 + c.rot);                                     // 横倒し
    ctx.scale(1.45, 1.45);
    ctx.fillStyle = c.ally ? "#4a5a3a" : (c.mid ? "#3c4152" : "#6a3a30");   // 胴体
    roundRect(-3.5, -3, 7, 6, 2);
    ctx.fillStyle = c.ally ? "#2c3320" : (c.mid ? "#20222e" : "#33201a");   // 脚
    ctx.fillRect(-2.6, 3, 2.2, 4.5);
    ctx.fillRect(0.6, 3, 2.2, 4.5);
    ctx.fillStyle = c.ally ? "#d8b48c" : "#c9a884";              // 頭
    ctx.beginPath(); ctx.arc(0, -6.3, 2.9, 0, 6.283); ctx.fill();
    ctx.fillStyle = c.ally ? "#38452c" : (c.mid ? "#1c1e28" : "#3a231e");   // ずれたヘルメット
    ctx.beginPath(); ctx.arc(1.2, -7.4, 3.1, Math.PI * 0.9, Math.PI * 1.9); ctx.fill();
    ctx.restore();
    ctx.restore();                                               // 遠近変換おわり
  }
  ctx.globalAlpha = 1;

  // ゲート
  for (const g of gates) drawGate(g);

  // 弾(武器ごとに見た目が変わる・派手なグロー付き)
  for (const b of bullets){
    const w = WEAPONS[b.wi || 0];
    beginPersp(b.x, b.y);
    ctx.fillStyle = w.color;
    if (w.cannon){
      ctx.globalAlpha = 0.28;                       // 発光グロー
      ctx.beginPath(); ctx.arc(b.x, b.y, 13, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, 6.283); ctx.fill();
      ctx.fillStyle = "#a34d1e";
      ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, 6.283); ctx.fill();
    } else if (w.grenade){
      // くるくる回りながら飛ぶ手榴弾
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.y * 0.08);
      ctx.fillStyle = "#5a7a3a";
      ctx.beginPath(); ctx.ellipse(0, 0, 5, 6.5, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = "#8a8a8a";
      ctx.fillRect(-2, -9, 4, 3.5);
      ctx.restore();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = "#a8d86b";
      ctx.beginPath(); ctx.arc(b.x, b.y, 10, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (w.stream){
      // 火炎放射・毒ガス: 飛ぶほど広がって薄くなる噴射の粒
      const tt = Math.min(1, (b.trav || 0) / (w.range || 200));
      ctx.globalAlpha = 0.75 * (1 - tt * 0.65);
      ctx.fillStyle = w.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, 3 + tt * 10, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 0.5 * (1 - tt * 0.5);
      ctx.fillStyle = b.wi === 9 ? "#ffd76b" : "#c8ffa0";      // 芯の色(炎=黄 / ガス=淡緑)
      ctx.beginPath(); ctx.arc(b.x, b.y - 2, 1.8 + tt * 4, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (w.missile){
      ctx.fillStyle = "#e8e8e8";
      ctx.fillRect(b.x - 3, b.y - 14, 6, 14);
      ctx.fillStyle = "#ff5a5a";
      ctx.beginPath(); ctx.moveTo(b.x - 3, b.y - 14); ctx.lineTo(b.x + 3, b.y - 14); ctx.lineTo(b.x, b.y - 21); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffb060";
      ctx.fillRect(b.x - 2, b.y, 4, 5 + Math.random() * 5);
    } else if (w.pierce){                           // レーザー: 進行方向を向いて飛び、壁で反射
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx || 0) + Math.PI / 2);
      ctx.globalAlpha = 0.3;
      ctx.fillRect(-w.bw * 2, 0, w.bw * 4, w.bh * 1.6);
      ctx.globalAlpha = 1;
      ctx.fillRect(-w.bw / 2, -w.bh, w.bw, w.bh * 2);
      ctx.restore();
    } else {
      if (b.wi === 1){                              // ライフルは鋭い残光
        ctx.globalAlpha = 0.25;
        ctx.fillRect(b.x - w.bw/2, b.y, w.bw, w.bh * 1.2);
        ctx.globalAlpha = 1;
      }
      ctx.fillRect(b.x - w.bw/2, b.y - w.bh, w.bw, w.bh);
    }
    ctx.restore();                                  // 遠近変換おわり
  }

  // 敵
  for (const en of enemies) drawEnemy(en);

  // 特攻部隊(前線で戦う味方)
  for (let ri = 0; ri < raiders.length; ri++) drawRaider(raiders[ri], raiderMid(ri));

  // ボス(複数対応)
  for (const bb of bosses) drawBoss(bb);

  // 部隊
  if (state !== "over") drawSquad();

  // 連れ去られる捕虜(縄で縛られた兵士)
  for (const c of captives){
    ctx.save();
    const cps = pf(c.y);
    ctx.translate(px(c.x, c.y), c.y);
    ctx.scale(cps * 1.9, cps * 1.9);
    ctx.globalAlpha = Math.max(0, Math.min(1, c.t));
    drawPersonIcon(0, 0, "#ffb0b0");
    ctx.strokeStyle = "rgba(90,60,40,0.9)"; ctx.lineWidth = 1.4;   // 縄
    ctx.beginPath(); ctx.moveTo(-5.5, 0); ctx.lineTo(5.5, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-5.5, 3.5); ctx.lineTo(5.5, 3.5); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // 手榴弾の爆発範囲UI(広がる輪)
  for (const bl of blasts){
    const k = 1 - bl.t / 0.4;
    const rr = bl.max * (0.35 + 0.65 * k);
    beginPersp(bl.x, bl.y);
    ctx.globalAlpha = Math.max(0, (1 - k) * 0.3);
    ctx.fillStyle = "#a8d86b";
    ctx.beginPath(); ctx.arc(bl.x, bl.y, rr, 0, 6.283); ctx.fill();
    ctx.globalAlpha = Math.max(0, (1 - k) * 0.85);
    ctx.strokeStyle = "#e4ff9c"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(bl.x, bl.y, rr, 0, 6.283); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // パーティクル
  for (const p of parts){
    ctx.globalAlpha = Math.max(p.t*2, 0);
    ctx.fillStyle = p.color;
    const pps = pf(p.y);
    ctx.fillRect(px(p.x, p.y) - 2 * pps, p.y - 2 * pps, 4 * pps, 4 * pps);
  }
  ctx.globalAlpha = 1;

  // 武器ごとの飛び道具(衝撃波・矢・槍・鞭・爆弾)
  for (const wv of waves){
    const ang = Math.atan2(wv.vy, wv.vx);
    ctx.save();
    const wps = pf(wv.y);
    ctx.translate(px(wv.x, wv.y), wv.y);
    ctx.scale(wps, wps);
    if (wv.kind === "breath"){
      // 毒の息(広がりながら薄れる緑の霧)
      const life = Math.max(0, wv.ttl || 0);
      ctx.globalAlpha = Math.min(0.55, life * 0.9);
      ctx.fillStyle = "#7de85c";
      ctx.beginPath(); ctx.arc(0, 0, 8 + (0.9 - life) * 16, 0, 6.283); ctx.fill();
      ctx.fillStyle = "#b6f57a";
      ctx.globalAlpha = Math.min(0.4, life * 0.7);
      ctx.beginPath(); ctx.arc(3, -3, 4.5, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (wv.kind === "bomb"){
      // 爆弾: 黒い球+導火線の火花
      ctx.fillStyle = "#2c3140";
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, 6.283); ctx.fill();
      ctx.strokeStyle = "#8a5a2b"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(3, -8); ctx.quadraticCurveTo(8, -13, 6, -16); ctx.stroke();
      ctx.fillStyle = Math.random() < 0.5 ? "#ffd76b" : "#ff9c5c";
      ctx.beginPath(); ctx.arc(6, -16, 3, 0, 6.283); ctx.fill();
    } else if (wv.kind === "arrow"){
      ctx.rotate(ang);
      ctx.strokeStyle = "#d9c9a3"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(8, 0); ctx.stroke();
      ctx.fillStyle = "#e8eef8";
      ctx.beginPath(); ctx.moveTo(8, -4); ctx.lineTo(15, 0); ctx.lineTo(8, 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ff8a8a";
      ctx.fillRect(-14, -3, 4, 6);
    } else if (wv.kind === "spear"){
      ctx.rotate(ang);
      ctx.strokeStyle = "#b08a54"; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(10, 0); ctx.stroke();
      ctx.fillStyle = "#e8eef8";
      ctx.beginPath(); ctx.moveTo(10, -5); ctx.lineTo(22, 0); ctx.lineTo(10, 5); ctx.closePath(); ctx.fill();
    } else if (wv.kind === "whip"){
      ctx.rotate(ang);
      ctx.strokeStyle = "rgba(255,140,180,0.95)"; ctx.lineWidth = 4.5;
      ctx.beginPath(); ctx.arc(-14, 0, 34, -1.2, 1.2); ctx.stroke();
      ctx.globalAlpha = 0.4;
      ctx.beginPath(); ctx.arc(-26, 0, 28, -1.0, 1.0); ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      ctx.rotate(ang);
      const R = wv.big ? 26 : 14;
      ctx.strokeStyle = wv.big ? "rgba(255,170,90,0.95)" : "rgba(225,238,255,0.9)";
      ctx.lineWidth = wv.big ? 5.5 : 3.5;
      ctx.beginPath(); ctx.arc(-R * 0.4, 0, R, -1.05, 1.05); ctx.stroke();
      ctx.globalAlpha = 0.4;
      ctx.beginPath(); ctx.arc(-R * 0.95, 0, R * 0.8, -0.9, 0.9); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  // 斬撃エフェクト
  for (const s of slashes){
    const p = 1 - s.t / 0.22;
    ctx.save();
    const sps = pf(s.y);
    ctx.translate(px(s.x, s.y), s.y);
    ctx.scale(sps, sps);
    ctx.rotate(s.ang);
    ctx.strokeStyle = "rgba(255,255,255," + Math.min(1, s.t * 4.5).toFixed(2) + ")";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 26, -1.1 + p * 1.8, -0.3 + p * 1.8); ctx.stroke();
    ctx.strokeStyle = "rgba(255,220,140," + Math.min(1, s.t * 3).toFixed(2) + ")";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 19, -1.1 + p * 1.8, -0.3 + p * 1.8); ctx.stroke();
    ctx.restore();
  }

  // 浮かぶテキスト
  for (const f of floats){
    ctx.globalAlpha = Math.min(f.t, 1);
    ctx.fillStyle = f.color;
    ctx.font = "bold 22px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(f.text, px(f.x, f.y), f.y);
  }
  ctx.globalAlpha = 1;

  // ボス出現予告
  if (state === "play" && bossWarnT > 0 && Math.floor(bossWarnT * 6) % 2 === 0){
    ctx.fillStyle = "#ff5a5a";
    ctx.font = "bold 44px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("⚠ BOSS ⚠", W/2, 300);
  }

  // HUD
  ctx.textAlign = "left";
  ctx.fillStyle = "#9cc4ff";
  ctx.font = "bold 13px -apple-system, sans-serif";
  {
    ctx.fillText("🎖 幹部 " + player.count + "/10人 / 🔥 特攻 " + raiders.length + "人", 14, 34);
    // 武器を「使用中」と「保管中」に分けて表示
    const use = [], store = [];
    let left = player.count;
    for (const st of player.weapons){
      const u = Math.min(st.n, left); left -= u;
      const nm = WEAPONS[st.wid].short || WEAPONS[st.wid].name;
      if (u > 0) use.push(nm + "×" + u);
      if (st.n - u > 0) store.push(nm + "×" + (st.n - u));
    }
    if (left > 0) use.unshift("拳銃×" + left);          // 残りの幹部はデフォルトの拳銃
    let mleft = raiders.length;
    for (const st of player.melee){
      const u = Math.min(st.n, mleft); mleft -= u;
      if (u > 0) use.push(MELEE[st.mid].name + "×" + u);
      if (st.n - u > 0) store.push(MELEE[st.mid].name + "×" + (st.n - u));
    }
    ctx.font = "11px -apple-system, sans-serif";
    ctx.fillStyle = "rgba(255,215,107,0.9)";
    ctx.fillText("使用中: " + use.join(" "), 14, 51);
    ctx.fillStyle = "rgba(200,210,228,0.8)";
    ctx.fillText("保管中: " + (store.length ? store.join(" ") : "なし"), 14, 66);
  }
  ctx.textAlign = "right";
  ctx.fillStyle = "#ffd76b";
  ctx.font = "bold 18px -apple-system, sans-serif";
  ctx.fillText("STAGE " + stage + "/10", W - 14, 34);
  // ボスまでの残り距離
  if (state === "play" && !bossFight && bossWarnT <= 0){
    ctx.font = "11px -apple-system, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.fillText("ボスまで " + Math.max(0, Math.ceil(nextBossAt - meters)) + " m", W - 14, 52);
  }

  // ステージ転換: 暗転カーテンで場面がガラッと切り替わる
  if (state === "play" && stageBannerT > 0){
    let a;
    if (stageBannerT > 1.4)      a = (2.2 - stageBannerT) / 0.8;  // 閉じる
    else if (stageBannerT > 0.7) a = 1;                            // 真っ暗(この間にテーマ切替)
    else                         a = stageBannerT / 0.7;           // 開く
    ctx.fillStyle = "rgba(4,6,14," + Math.min(1, Math.max(0, a)).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = Math.min(stageBannerT, 1);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd76b";
    ctx.font = "bold 46px -apple-system, sans-serif";
    ctx.fillText("STAGE " + stage, W/2, 300);
    ctx.globalAlpha = 1;
  }

  if (flash > 0){
    ctx.fillStyle = "rgba(255,80,80," + (flash*0.35) + ")";
    ctx.fillRect(-10,-10,W+20,H+20);
  }
  ctx.restore();

  if (state === "title") drawTitle();
  if (state === "over")  drawOver();
  if (state === "win")   drawWin();
}

function gateColors(g){
  if (g.op === "wpn")
    return { fill:"rgba(255,200,60,0.22)", edge:"#ffc83c", text:"#ffdf9c" };
  if (g.chain)
    return { fill:"rgba(60,220,140,0.24)", edge:"#3ce88c", text:"#a9f5ce" };  // 連続パネルは緑
  const good = (g.op === "add" || (g.op === "mul" && g.val >= 1));
  return good
    ? { fill:"rgba(40,120,255,0.28)", edge:"#4d8dff", text:"#8fc1ff" }
    : { fill:"rgba(255,60,60,0.25)",  edge:"#ff5a5a", text:"#ffb0b0" };
}
function gateLabel(g){
  if (g.chain) return "+" + Math.round(g.val);
  return String(Math.max(0, Math.round(g.val)));   // 必要射撃回数
}
// 宝箱(色違い: 武器=金/木、プラス=青、マイナス=赤、連続=緑)
function drawChest(cx, y, lidC, bodyC, trimC, glowC){
  ctx.fillStyle = glowC;                                       // 光る輪
  ctx.beginPath(); ctx.arc(cx, y - 30, 30, 0, 6.283); ctx.fill();
  ctx.fillStyle = lidC;                                        // アーチ形のフタ
  ctx.beginPath();
  ctx.moveTo(cx - 22, y - 26);
  ctx.quadraticCurveTo(cx, y - 42, cx + 22, y - 26);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = trimC; ctx.lineWidth = 2;                  // フタの縁
  ctx.beginPath();
  ctx.moveTo(cx - 22, y - 26);
  ctx.quadraticCurveTo(cx, y - 42, cx + 22, y - 26);
  ctx.stroke();
  ctx.fillStyle = bodyC;                                       // 本体
  roundRect(cx - 22, y - 26, 44, 15, 3);
  ctx.fillStyle = "rgba(0,0,0,0.35)";                          // フタとの境目
  ctx.fillRect(cx - 22, y - 27, 44, 2);
  ctx.fillStyle = trimC;                                       // 縁と錠前
  ctx.fillRect(cx - 22, y - 26, 3, 15);
  ctx.fillRect(cx + 19, y - 26, 3, 15);
  ctx.fillRect(cx - 22, y - 13, 44, 2.5);
  roundRect(cx - 4.5, y - 25, 9, 10, 2);
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.fillRect(cx - 1.5, y - 22, 3, 4.5);                      // 鍵穴
}
function drawGate(g){
  const w = laneW();
  for (let i = 0; i < LANES; i++){
    const s = g.slots[i];
    if (!s) continue;                        // 空き枠は何も描かない
    const x0 = ROAD_L + i * w + 2, x1 = ROAD_L + (i + 1) * w - 2;
    const cx = (x0 + x1) / 2;
    const fl = Math.max(0, s.flash || 0);
    ctx.save();
    {  // 遠近変換(奥ほど小さく・中央に寄る)
      const ps = pf(g.y);
      ctx.translate(px(cx, g.y), g.y);
      ctx.scale(ps, ps);
      ctx.translate(-cx, -g.y);
    }
    if (fl > 0) ctx.translate((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 2);  // 被弾中は震える
    ctx.globalAlpha = s.used ? 0.25 : 1;
    ctx.textAlign = "center";
    if (s.op === "wpn"){
      // 武器の宝箱: 撃つほどもらえる本数(×N)が増え、数字を0まで撃ち切ると回収
      drawChest(cx, g.y, "#7a4e22", "#8f5c2a", "#e8c840", "rgba(255,200,60,0.14)");
      drawWeaponIcon(s.wid, cx - 8, g.y - 46);                   // 宝箱の上に武器
      ctx.fillStyle = "#ffe98a";
      ctx.font = "bold 13px -apple-system, sans-serif";
      ctx.fillText("×" + (s.wn || 1), cx + 15, g.y - 42);        // もらえる武器の本数
      ctx.fillStyle = "#ffdf9c";
      ctx.font = "bold 11px -apple-system, sans-serif";
      ctx.fillText(WEAPONS[s.wid].short || WEAPONS[s.wid].name, cx, g.y - 2);
      const label = gateLabel(s);
      ctx.fillStyle = "#fff1c4";
      const fs = label.length >= 4 ? 15 : 18;
      ctx.font = "bold " + Math.round(fs + fl * 8) + "px -apple-system, sans-serif";
      ctx.fillText(label, cx, g.y - 66);                         // 残り射撃回数
    } else if (s.op === "mwpn"){
      // 近接武器の宝箱(鋼鉄の箱): 特攻部隊が装備する
      drawChest(cx, g.y, "#4a4f5c", "#5a6070", "#c8d2e4", "rgba(160,180,220,0.14)");
      ctx.save();
      ctx.translate(cx - 6, g.y - 46);
      drawMeleeIcon(s.mid, 0, 0);
      ctx.restore();
      ctx.fillStyle = "#e4ecf8";
      ctx.font = "bold 13px -apple-system, sans-serif";
      ctx.fillText("×" + (s.wn || 1), cx + 15, g.y - 42);        // もらえる本数
      ctx.fillStyle = "#c8d2e4";
      ctx.font = "bold 11px -apple-system, sans-serif";
      ctx.fillText(MELEE[s.mid].name + "(特攻)", cx, g.y - 2);
      const label = gateLabel(s);
      ctx.fillStyle = "#e4ecf8";
      const fs = label.length >= 4 ? 15 : 18;
      ctx.font = "bold " + Math.round(fs + fl * 8) + "px -apple-system, sans-serif";
      ctx.fillText(label, cx, g.y - 66);                         // 残り射撃回数
    } else if (s.chain){
      // 緑の連続パネル: 通過で+1
      drawChest(cx, g.y, "#1f6b42", "#2a8252", "#7ff0b2", "rgba(60,220,140,0.16)");
      ctx.fillStyle = "#a9f5ce";
      ctx.font = "bold 20px -apple-system, sans-serif";
      ctx.fillText(gateLabel(s), cx + 7, g.y - 48);
      drawPersonIcon(cx - 7 - ctx.measureText(gateLabel(s)).width / 2 - 8, g.y - 54, "#a9f5ce");
    } else {
      // 人の宝箱: 撃ち切ると檻の仲間を救出。青=幹部 / 赤=特攻部隊
      const assault = s.kind === "assault";
      if (assault) drawChest(cx, g.y, "#8a4a2c", "#9c5836", "#ffb08a", "rgba(255,140,90,0.15)");
      else         drawChest(cx, g.y, "#2c4f8a", "#376099", "#8fc1ff", "rgba(80,150,255,0.15)");
      ctx.fillStyle = assault ? "#ffb08a" : "#8fc1ff";
      ctx.font = "bold 11px -apple-system, sans-serif";
      ctx.fillText(assault ? "特攻部隊" : "幹部", cx, g.y - 2);
      const label = gateLabel(s);
      ctx.fillStyle = assault ? "#ffb08a" : "#8fc1ff";
      const fs = label.length >= 5 ? 15 : label.length >= 4 ? 17 : 20;
      ctx.font = "bold " + Math.round(fs + fl * 10) + "px -apple-system, sans-serif";  // 数字がポンと跳ねる
      ctx.fillText(label, cx, g.y - 48);                         // 必要射撃回数
      // 捕らわれている仲間(1〜5人)を檻の中に表示
      const gn = Math.min(s.gain || 1, 5);
      const cw = Math.max(30, gn * 13 + 10);
      ctx.fillStyle = "rgba(16,22,36,0.7)";                      // 檻の中の暗がり
      roundRect(cx - cw/2, g.y - 85, cw, 24, 4);
      for (let k = 0; k < gn; k++)
        drawPersonIcon(cx - (gn - 1) * 6.5 + k * 13, g.y - 73, assault ? "#ffb08a" : "#a9d4ff");
      ctx.strokeStyle = "#9aa4b8"; ctx.lineWidth = 1.5;          // 檻の格子
      const bars = Math.max(3, gn + 1);
      for (let k = 1; k < bars; k++){
        const bx = cx - cw/2 + (cw * k / bars);
        ctx.beginPath(); ctx.moveTo(bx, g.y - 85); ctx.lineTo(bx, g.y - 61); ctx.stroke();
      }
      ctx.strokeRect(cx - cw/2, g.y - 85, cw, 24);               // 檻の枠
    }
    if (fl > 0){                               // 被弾リング
      ctx.strokeStyle = "rgba(255,255,255," + Math.min(1, fl * 3).toFixed(2) + ")";
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(cx, g.y - 22, 27 + fl * 20, 0, 6.283); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// 人のシルエットアイコン(増減パネル用)
function drawPersonIcon(x, y, color){
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y - 6, 3.8, 0, 6.283); ctx.fill();   // 頭
  ctx.beginPath();                                                  // 肩〜胴
  ctx.moveTo(x - 5.5, y + 7);
  ctx.quadraticCurveTo(x, y - 2.5, x + 5.5, y + 7);
  ctx.closePath(); ctx.fill();
}

// 車・戦車のミニアイコン
function drawVehicleIcon(kind, x, y){
  ctx.save();
  ctx.translate(x, y);
  if (kind === "tank"){
    ctx.fillStyle = "#4e6b4a";
    roundRect(-16, -2, 32, 10, 4);                              // 履帯
    ctx.fillStyle = "#2f4230";
    ctx.beginPath(); ctx.arc(-10, 3, 3, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 3, 3, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(10, 3, 3, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#5e8257";
    roundRect(-8, -10, 16, 9, 3);                               // 砲塔
    ctx.fillStyle = "#7aa06f";
    ctx.fillRect(6, -8, 16, 3);                                 // 砲身
  } else {
    ctx.fillStyle = "#4d8dff";
    roundRect(-15, -6, 30, 10, 4);                              // 車体
    ctx.fillStyle = "#8fc1ff";
    roundRect(-7, -12, 15, 8, 3);                               // キャビン
    ctx.fillStyle = "#1d2740";
    ctx.beginPath(); ctx.arc(-8, 5, 4, 0, 6.283); ctx.fill();   // 車輪
    ctx.beginPath(); ctx.arc(8, 5, 4, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

// 武器のミニアイコン(ベクター描画)。(x, y)を中心に横向きで描く
function drawWeaponIcon(wid, x, y){
  ctx.save();
  ctx.translate(x, y);
  const METAL = "#d7deea", DARK = "#5a6478", ACC = WEAPONS[wid].color;
  if (wid === 1){            // ライフル: 長い銃身+ストック+スコープ
    ctx.fillStyle = DARK;  ctx.fillRect(-17, -1, 8, 6);           // ストック
    ctx.fillStyle = METAL; ctx.fillRect(-10, -2, 26, 4);          // 銃身
    ctx.fillStyle = ACC;   ctx.fillRect(-2, -6, 8, 3);            // スコープ
    ctx.fillStyle = DARK;  ctx.fillRect(-4, 2, 4, 6);             // グリップ
  } else if (wid === 2){     // マシンガン: 太い本体+マガジン
    ctx.fillStyle = METAL; ctx.fillRect(-15, -3, 28, 6);
    ctx.fillStyle = ACC;   ctx.fillRect(13, -2, 5, 4);            // マズル
    ctx.fillStyle = DARK;  ctx.fillRect(-4, 3, 6, 9);             // マガジン
    ctx.fillStyle = DARK;  ctx.fillRect(-13, 3, 4, 6);            // グリップ
  } else if (wid === 3){     // ショットガン: 二連銃身
    ctx.fillStyle = DARK;  ctx.fillRect(-17, -3, 8, 8);           // ストック
    ctx.fillStyle = METAL; ctx.fillRect(-10, -4, 26, 3);          // 上銃身
    ctx.fillStyle = METAL; ctx.fillRect(-10, 1, 26, 3);           // 下銃身
    ctx.fillStyle = ACC;   ctx.fillRect(12, -4, 4, 8);            // 銃口
  } else if (wid === 4){     // 大砲: 砲身+車輪
    ctx.rotate(-0.35);
    ctx.fillStyle = METAL; ctx.fillRect(-8, -6, 24, 10);          // 砲身
    ctx.fillStyle = ACC;   ctx.fillRect(14, -7, 4, 12);           // 砲口
    ctx.rotate(0.35);
    ctx.fillStyle = DARK;
    ctx.beginPath(); ctx.arc(-6, 7, 6, 0, 6.283); ctx.fill();     // 車輪
    ctx.fillStyle = "#2c3140";
    ctx.beginPath(); ctx.arc(-6, 7, 2.5, 0, 6.283); ctx.fill();
  } else if (wid === 5){     // レーザー: 本体+発光する砲口+ビーム
    ctx.fillStyle = DARK;  ctx.fillRect(-14, -3, 18, 7);
    ctx.fillStyle = METAL; ctx.fillRect(-14, -3, 18, 3);
    ctx.fillStyle = ACC;
    ctx.beginPath(); ctx.arc(7, 0, 4, 0, 6.283); ctx.fill();      // 発光部
    ctx.globalAlpha *= 0.55;
    ctx.fillRect(10, -1.5, 10, 3);                                // ビーム
    ctx.globalAlpha /= 0.55;
  } else if (wid === 6){     // ロケットランチャー: 肩担ぎの発射筒
    ctx.rotate(-0.35);
    ctx.fillStyle = "#4e6b4a"; ctx.fillRect(-16, -5, 32, 10);     // 筒
    ctx.fillStyle = "#2f4230"; ctx.fillRect(12, -6, 5, 12);       // 砲口リング
    ctx.fillStyle = "#2f4230"; ctx.fillRect(-16, -6, 4, 12);      // 後端
    ctx.fillStyle = "#ff5a5a";
    ctx.beginPath(); ctx.moveTo(17, -4); ctx.lineTo(24, 0); ctx.lineTo(17, 4); ctx.closePath(); ctx.fill(); // ロケット先端
    ctx.fillStyle = DARK; ctx.fillRect(-5, 5, 5, 7);              // グリップ
    ctx.fillStyle = ACC;  ctx.fillRect(2, -8, 8, 3);              // 照準器
    ctx.rotate(0.35);
  } else if (wid === 7){     // 戦車
    drawVehicleIcon("tank", 0, 0);

    ctx.fillStyle = "#ffd76b";
    ctx.beginPath(); ctx.arc(18, 0, 2.2, 0, 6.283); ctx.fill();
  } else if (wid === 10){    // 毒ガス噴射器: ボンベ+ホース+ガス雲
    ctx.fillStyle = "#3e6b3e"; ctx.fillRect(-14, -9, 8, 14);      // ボンベ

    ctx.globalAlpha /= 0.85;
  }
  ctx.restore();
}
function drawEnemy(en){
  const r = enemyRadius(en);
  const shown = Math.min(en.count, 20);
  const mid = (en.hpPer || 1) > 1;
  beginPersp(en.x, en.y);
  {                                              // 近づくほど大きく見える(遠近感)
    const dk = depthK(en.y);
    ctx.translate(en.x, en.y);
    ctx.scale(dk, dk);
    ctx.translate(-en.x, -en.y);
  }
  if (en.y - r < 0) ctx.globalAlpha = 0.55;      // 完全に画面に入るまでは半透明(無敵)
  for (let i = 0; i < shown; i++){
    const a = i * 2.39996;                         // 黄金角で散らす(回転しない=ぐるぐりを防ぐ)
    const rr = (4 + Math.sqrt(i) * 7) * 1.35;
    const ex = en.x + Math.cos(a) * rr * 0.9;
    const ey = en.y + Math.sin(a) * rr * 0.55 + Math.sin(en.wob + i) * 1.5;
    // 3頭身の敵兵(味方と同じサイズ)。中堅兵は装甲つきでひと回りだけ大きい
    ctx.save();
    ctx.translate(ex, ey);
    ctx.scale(mid ? 1.5 : 1.35, mid ? 1.5 : 1.35);
    ctx.fillStyle = mid ? "#20222e" : "#33201a";   // 軍パンツ
    ctx.fillRect(-3, 2, 2.4, 5);
    ctx.fillRect(0.6, 2, 2.4, 5);
    ctx.fillStyle = mid ? "#3c4152" : "#6a3a30";   // 軍服(中堅は装甲色)
    roundRect(-3.8, -4, 7.6, 6.6, 2);
    ctx.fillStyle = mid ? "#565e78" : "#4a2a22";   // ベスト/装甲プレート
    ctx.fillRect(-2.4, -3.4, 4.8, 5.8);
    ctx.fillStyle = mid ? "#a8a8b8" : "#c9a884";   // 顔(中堅はフェイスガード)
    ctx.beginPath(); ctx.arc(0, -7.6, 3.4, 0, 6.283); ctx.fill();
    if (mid){                                      // 赤く光るバイザー(一本線)
      ctx.fillStyle = "#ff4040";
      ctx.fillRect(-2.7, -8.2, 5.4, 1.6);
    } else {                                       // 赤く光る目
      ctx.fillStyle = "#ff4040";
      ctx.fillRect(-2.2, -8, 1.4, 1.4);
      ctx.fillRect(0.8, -8, 1.4, 1.4);
    }
    ctx.fillStyle = mid ? "#1c1e28" : "#3a231e";   // ヘルメット
    ctx.beginPath(); ctx.arc(0, -8.6, 3.7, Math.PI, 0); ctx.fill();
    ctx.fillRect(-3.7, -9.1, 7.4, 1.6);            // つば
    if (mid){                                       // 肩の装甲
      ctx.fillStyle = "#565e78";
      ctx.fillRect(-4.6, -4.2, 2, 3);
      ctx.fillRect(2.6, -4.2, 2, 3);
    }
    // 一人ひとりの体力ゲージ(先頭の1体はダメージの残りHPを表示)
    const uf = i === 0
      ? Math.max(0, ((en.hpPer || 1) - (en.hpBuf || 0)) / (en.hpPer || 1)) : 1;
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(-4.4, -14.2, 8.8, 2.3);
    ctx.fillStyle = "#ff7a6b";
    ctx.fillRect(-3.9, -13.7, 7.8 * uf, 1.4);
    ctx.restore();
  }
  // 得物(攻撃タイプごと)。攻撃時に振り下ろす
  ctx.save();
  ctx.translate(en.x + r * 0.85, en.y - 2);
  const esw = (en.swingT || 0) > 0 ? (0.25 - en.swingT) * 8 - 0.3 : Math.sin(en.wob) * 0.15;
  ctx.rotate(esw);
  if (en.atype === "axe"){
    ctx.scale(0.38, 0.38);
    drawBossWeapon("axe");
  } else if (en.atype === "poison"){
    // 毒の霧をまとう
    ctx.fillStyle = "rgba(125,232,92,0.75)";
    ctx.beginPath(); ctx.arc(0, -6, 4, 0, 6.283); ctx.fill();
    ctx.fillStyle = "rgba(182,245,122,0.6)";
    ctx.beginPath(); ctx.arc(2.5, -11, 2.6, 0, 6.283); ctx.fill();
  } else {
    // 振り上げた拳(殴る)
    ctx.fillStyle = "#c9a884";
    ctx.beginPath(); ctx.arc(0, -7, 3.4, 0, 6.283); ctx.fill();
    ctx.strokeStyle = "#8a6a4a"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-3, -12); ctx.lineTo(-3, -7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0.5, -13); ctx.lineTo(0.5, -7.5); ctx.stroke();
  }
  ctx.restore();
  // 体力ゲージのみ(数字は非表示。中堅兵は枠が青銀色)
  const eHp = Math.max(0, en.count * (en.hpPer || 1) - (en.hpBuf || 0));
  const eMax = Math.max(1, en.maxHp || eHp);
  ctx.fillStyle = mid ? "rgba(30,34,60,0.75)" : "rgba(0,0,0,0.55)";
  roundRect(en.x - 21, en.y - r - 19, 42, 11, 5);
  ctx.fillStyle = "#4a2230";
  ctx.fillRect(en.x - 17, en.y - r - 15.5, 34, 4);
  ctx.fillStyle = "#ff7a6b";
  ctx.fillRect(en.x - 17, en.y - r - 15.5, 34 * Math.min(1, eHp / eMax), 4);
  ctx.globalAlpha = 1;
  ctx.restore();                                 // 遠近変換おわり
}
function drawBoss(b){
  beginPersp(b.x, b.y);
  {                                              // 近づくほど大きく見える(遠近感)
    const dk = depthK(b.y);
    ctx.translate(b.x, b.y);
    ctx.scale(dk, dk);
    ctx.translate(-b.x, -b.y);
  }
  if (b.y - b.r < 0) ctx.globalAlpha = 0.55;     // 完全に画面に入るまでは半透明(無敵)
  const bob = Math.sin(b.wob) * 3;
  const r = b.r, cx = b.x, cy = b.y + bob;
  const SKIN = "#d8a87c", SKIN_D = "#b8875c", VEST = "#4a5a3a", VEST_D = "#38452c";
  const flex = 1 + Math.sin(b.wob * 1.3) * 0.06;   // 力こぶがピクピク動く

  // 腕(丸太のような上腕二頭筋+前腕)
  ctx.fillStyle = SKIN;
  ctx.beginPath(); ctx.arc(cx - r*0.98, cy + r*0.02, r*0.42*flex, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + r*0.98, cy + r*0.02, r*0.42*flex, 0, 6.283); ctx.fill();
  ctx.fillStyle = SKIN_D;
  ctx.beginPath(); ctx.arc(cx - r*1.08, cy + r*0.4, r*0.3, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + r*1.08, cy + r*0.4, r*0.3, 0, 6.283); ctx.fill();

  // 逆三角形の胴体(タンクトップ)
  ctx.fillStyle = VEST;
  ctx.beginPath();
  ctx.moveTo(cx - r*0.95, cy - r*0.45);
  ctx.lineTo(cx + r*0.95, cy - r*0.45);
  ctx.lineTo(cx + r*0.58, cy + r*0.95);
  ctx.lineTo(cx - r*0.58, cy + r*0.95);
  ctx.closePath(); ctx.fill();
  // 肩の筋肉
  ctx.fillStyle = SKIN;
  ctx.beginPath(); ctx.arc(cx - r*0.76, cy - r*0.4, r*0.36, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + r*0.76, cy - r*0.4, r*0.36, 0, 6.283); ctx.fill();
  // 胸筋と腹筋のライン
  ctx.strokeStyle = VEST_D; ctx.lineWidth = Math.max(2, r*0.06);
  ctx.beginPath(); ctx.moveTo(cx, cy - r*0.28); ctx.lineTo(cx, cy + r*0.6); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx - r*0.3, cy - r*0.02, r*0.28, -0.5, 1.1); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + r*0.3, cy - r*0.02, r*0.28, Math.PI - 1.1, Math.PI + 0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - r*0.28, cy + r*0.32); ctx.lineTo(cx + r*0.28, cy + r*0.32); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - r*0.26, cy + r*0.55); ctx.lineTo(cx + r*0.26, cy + r*0.55); ctx.stroke();
  // ベルト
  ctx.fillStyle = "#2a2a30";
  ctx.fillRect(cx - r*0.58, cy + r*0.82, r*1.16, r*0.16);
  ctx.fillStyle = "#c8a038";
  ctx.fillRect(cx - r*0.1, cy + r*0.79, r*0.2, r*0.22);

  // 頭(太い首+短髪+ベレー帽)
  const hy = cy - r*0.8;
  ctx.fillStyle = SKIN_D;
  ctx.fillRect(cx - r*0.16, cy - r*0.6, r*0.32, r*0.18);       // 太い首
  ctx.fillStyle = SKIN;
  ctx.beginPath(); ctx.arc(cx, hy, r*0.34, 0, 6.283); ctx.fill();
  ctx.fillStyle = VEST_D;                                       // ベレー帽
  ctx.beginPath(); ctx.arc(cx, hy - r*0.1, r*0.35, Math.PI, 0); ctx.fill();
  ctx.fillRect(cx - r*0.35, hy - r*0.12, r*0.7, r*0.07);
  ctx.fillStyle = "#c33";                                       // 帽章
  ctx.fillRect(cx + r*0.12, hy - r*0.3, r*0.1, r*0.08);
  // 顔: 鋭い目・食いしばった口・傷跡
  ctx.fillStyle = "#2a1a10";
  ctx.fillRect(cx - r*0.22, hy - r*0.04, r*0.13, r*0.06);
  ctx.fillRect(cx + r*0.09, hy - r*0.04, r*0.13, r*0.06);
  ctx.strokeStyle = "#2a1a10"; ctx.lineWidth = Math.max(1.5, r*0.045);
  ctx.beginPath(); ctx.moveTo(cx - r*0.12, hy + r*0.17); ctx.lineTo(cx + r*0.12, hy + r*0.17); ctx.stroke();
  ctx.strokeStyle = "#a05a4a"; ctx.lineWidth = Math.max(1.5, r*0.035);
  ctx.beginPath(); ctx.moveTo(cx + r*0.17, hy - r*0.18); ctx.lineTo(cx + r*0.27, hy + r*0.02); ctx.stroke();
  // 得物(武器タイプごとに違う)。攻撃時に振り下ろす
  ctx.save();
  ctx.translate(b.x + b.r*0.95, b.y + bob - Math.sin(b.wob*1.3)*6);
  const swing = (b.swingT || 0) > 0 ? (0.25 - b.swingT) * 9 - 0.5 : -0.35 + Math.sin(b.wob) * 0.12;
  ctx.rotate(swing);
  const wk = Math.max(0.65, b.r / 46);
  ctx.scale(wk, wk);
  drawBossWeapon(b.wtype);
  ctx.restore();

  // HPバー
  const bw = Math.max(80, Math.round(b.r * 2.2)), bx = b.x - bw/2, by = b.y + bob - b.r - 26;
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  roundRect(bx - 4, by - 4, bw + 8, 16, 7);
  ctx.fillStyle = "#472020";
  ctx.fillRect(bx, by, bw, 8);
  ctx.fillStyle = "#ff5a5a";
  ctx.fillRect(bx, by, bw * Math.max(b.hp, 0) / b.maxHp, 8);
  ctx.fillStyle = "#ffd6d6";
  ctx.font = "bold 12px -apple-system, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("BOSS", b.x, by - 8);             // 数字は非表示
  ctx.globalAlpha = 1;
  ctx.restore();                                 // 遠近変換おわり
}
// ボスの得物(上向きに描き、drawBoss側で回転・拡縮される)

    ctx.strokeStyle = "#b8875c"; ctx.lineWidth = 2.5;

    ctx.beginPath(); ctx.moveTo(9, -38); ctx.lineTo(9, -30); ctx.stroke();
  } else if (wtype === "poison"){
    // 毒の霧(口から吐く)
    ctx.fillStyle = "rgba(125,232,92,0.8)";

    ctx.beginPath(); ctx.arc(7, -41, 7, 0, 6.283); ctx.fill();
    ctx.fillStyle = "rgba(182,245,122,0.5)";
    ctx.beginPath(); ctx.arc(-3, -52, 5, 0, 6.283); ctx.fill();
  }
}

function drawSquad(){
  beginPersp(player.x, player.y);
  // 被弾後の無敵時間中は点滅する
  if (player.inv > 0 && Math.floor(player.inv * 12) % 2 === 0) ctx.globalAlpha = 0.45;
  // 幹部を1つの隊列で描く(左上の幹部数と表示される人数は必ず一致する)
  // 前方=拳銃の幹部、後方=特殊武器に持ち替えた幹部
  const f = formationData(player.count);
  const wids = [];                                 // 特殊武器の並び
  {
    let left = player.count;
    for (const st of player.weapons){
      const k2 = Math.min(st.n, left);
      for (let q = 0; q < k2; q++) wids.push(st.wid);
      left -= k2;
    }
  }
  const pistolN = player.count - wids.length;
  for (let i = 0; i < f.pts.length; i++){
    const p = f.pts[i];
    const sx = player.x + p.x, sy = player.y + p.y * 0.8;
    if (i < pistolN){
      drawSoldier(sx, sy, 0);                      // デフォルトの拳銃
    } else {
      const wid = wids[i - pistolN];
      if (wid === 7) drawTankRide(sx, sy);         // 戦車は大きく描いて兵士が乗る
      else drawSoldier(sx, sy, wid);
    }
  }
  // (部隊全体の大きいゲージは廃止。体力表示は一人ひとりの小さいバーのみ)
  ctx.restore();                                 // 遠近変換おわり
}
// 特攻部隊の近接武器アイコン(棍棒・ナイフ・チェンソー)
function drawMeleeIcon(mid, x, y){
